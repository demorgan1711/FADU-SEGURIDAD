<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Planilla de Llaves</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#22303C" />
<link rel="icon" href="icons/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE8DD; --ink:#22303C; --ink-soft:#5B6B73; --brass:#B08D3D; --brass-soft:#E4D6AE;
    --green:#3F8F5F; --green-soft:#DCEEE1; --red:#B5432E; --red-soft:#F3DCD5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);}
  .display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:76px;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;}
  input{font-family:inherit;}
  .header{background:var(--ink);color:#F7F4EC;padding:20px 16px 12px;border-radius:0 0 14px 14px;display:flex;justify-content:space-between;align-items:center;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .plate{position:relative;background:#F7F4EC;border:1px solid #D8CFB8;border-radius:8px;aspect-ratio:1/0.85;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;}
  .dot{width:10px;height:10px;border-radius:999px;margin-bottom:4px;}
  @keyframes pulseG{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(63,143,95,.5)}50%{opacity:.45;box-shadow:0 0 0 7px rgba(63,143,95,0)}}
  @keyframes pulseR{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(181,67,46,.5)}50%{opacity:.45;box-shadow:0 0 0 7px rgba(181,67,46,0)}}
  .pg{animation:pulseG 1.3s ease-in-out infinite;} .pr{animation:pulseR 1.3s ease-in-out infinite;}
  .pgf{animation:pulseG .7s ease-in-out infinite;} .prf{animation:pulseR .7s ease-in-out infinite;}
  .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;}
  .tabs-inner{max-width:480px;width:100%;background:#fff;border-top:1px solid #D8CFB8;display:flex;justify-content:space-around;padding:8px 4px;}
  .tab-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-soft);position:relative;padding:2px 8px;}
  .tab-btn.active{color:var(--ink);font-weight:600;}
  .sheet{position:fixed;inset:0;background:rgba(34,48,60,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet-inner{max-width:480px;width:100%;max-height:88vh;overflow-y:auto;background:var(--paper);border-radius:16px 16px 0 0;padding:20px;}
  .btn-primary{background:var(--ink);color:#F7F4EC;padding:13px;border-radius:8px;font-weight:600;font-size:15px;width:100%;}
  .btn-primary:disabled{background:#C7BFA9;}
  .card{background:#fff;border:1px solid #D8CFB8;border-radius:10px;padding:12px;}
  .chip{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid #D8CFB8;background:#fff;white-space:nowrap;}
  .chip.active{background:var(--ink);color:#F7F4EC;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="app">
  <!-- LOGIN -->
  <div id="view-login" style="padding:60px 24px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="width:56px;height:56px;border-radius:999px;background:var(--brass-soft);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px;">🔑</div>
      <h1 class="display" style="font-size:26px;font-weight:700;margin:0;">Planilla de Llaves</h1>
      <p style="font-size:13px;color:var(--ink-soft);margin-top:4px;">Control de aulas y depósitos</p>
    </div>
    <label class="mono" style="font-size:11px;color:var(--ink-soft);">NOMBRE Y APELLIDO</label>
    <input id="login-name" placeholder="Ej: Marcelo Gómez" style="width:100%;background:#fff;border:1px solid #D8CFB8;border-radius:8px;padding:12px 14px;font-size:15px;margin:6px 0 18px;" />
    <label class="mono" style="font-size:11px;color:var(--ink-soft);">ROL</label>
    <div style="display:flex;gap:8px;margin:8px 0 28px;">
      <button id="role-recorrido" class="role-btn" style="flex:1;padding:14px 6px;border-radius:8px;border:1px solid var(--brass);background:var(--brass-soft);font-size:12px;font-weight:600;">🚶 Personal de recorrido</button>
      <button id="role-jefe" class="role-btn" style="flex:1;padding:14px 6px;border-radius:8px;border:1px solid #D8CFB8;background:#fff;font-size:12px;">👔 Jefe de oficina</button>
    </div>
    <button id="btn-login" class="btn-primary" disabled>Ingresar</button>
    <p style="font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;">Sin contraseña — el acceso es solo por nombre.</p>
  </div>

  <!-- APP -->
  <div id="view-app" class="hidden">
    <div class="header">
      <div>
        <p class="display" style="font-size:18px;font-weight:700;margin:0;">Planilla de Llaves</p>
        <p id="user-sub" style="font-size:12px;opacity:.75;margin:2px 0 0;"></p>
      </div>
      <button id="btn-logout" style="color:#F7F4EC;font-size:20px;">⎋</button>
    </div>

    <div style="padding:14px 16px;">
      <div id="tab-inicio"></div>
      <div id="tab-sectores" class="hidden"></div>
      <div id="tab-solicitudes" class="hidden"></div>
      <div id="tab-historial" class="hidden"></div>
      <div id="tab-personal" class="hidden"></div>
    </div>
  </div>
</div>

<div id="detail-root"></div>

<div class="tabs">
  <div class="tabs-inner">
    <button class="tab-btn active" data-tab="inicio">🏠<span>Inicio</span></button>
    <button class="tab-btn" data-tab="sectores">▦<span>Sectores</span></button>
    <button class="tab-btn" data-tab="solicitudes">🔔<span id="badge-label">Solicitudes</span></button>
    <button class="tab-btn" data-tab="historial">🕘<span>Historial</span></button>
    <button class="tab-btn hidden" id="tab-btn-personal" data-tab="personal">👥<span>Personal</span></button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, getDocs, onSnapshot,
  writeBatch, query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ======= 1) PEGÁ ACÁ TU CONFIG DE FIREBASE (Configuración del proyecto > Tus apps) ======= */
const firebaseConfig = {
  apiKey: "AIzaSyApTkrL46F0XhmMbZ6dEXYOVzcBca-iCaM",
  authDomain: "fadu-seguridad.firebaseapp.com",
  projectId: "fadu-seguridad",
  storageBucket: "fadu-seguridad.firebasestorage.app",
  messagingSenderId: "440485002142",
  appId: "1:440485002142:web:ad0a9dd7dc06742804348f"
};
/* ========================================================================================= */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SECTORS = [
  { id: "100", label: "Sector 100", prefix: "", start: 101, end: 126 },
  { id: "EP", label: "Sector EP", prefix: "EP", start: 101, end: 126 },
  { id: "200", label: "Sector 200", prefix: "", start: 201, end: 226 },
];
const ZONES = [
  { id: "100", label: "Sector 100" }, { id: "EP", label: "Sector EP" },
  { id: "200", label: "Sector 200" }, { id: "DEP", label: "Depósitos" },
];
const DELAY_MS = 15 * 60 * 1000;

let user = null;         // { name, role }
let doors = {};          // doorId -> data
let assignments = {};    // name -> zone
let history = [];
let activeTab = "inicio";
let activeSector = "100";
let openDoorId = null;

function now(){ return Date.now(); }
function fmtTime(ts){ if(!ts) return ""; return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function elapsed(ts){ const m=Math.floor((now()-ts)/60000); if(m<1) return "recién"; if(m<60) return `hace ${m} min`; const h=Math.floor(m/60); return `hace ${h} h ${m%60} min`; }

/* ---------- semilla de puertas (solo si la colección está vacía) ---------- */
async function seedDoorsIfNeeded() {
  const snap = await getDocs(collection(db, "doors"));
  if (!snap.empty) return;
  const batch = writeBatch(db);
  SECTORS.forEach(s => {
    for (let n = s.start; n <= s.end; n++) {
      const id = `${s.prefix}${n}`;
      batch.set(doc(db, "doors", id), { label:id, type:"aula", sector:s.id, sectorLabel:s.label, status:"closed", keyHolder:null, pendingRequest:null });
    }
  });
  for (let n = 1; n <= 36; n++) {
    const id = `D${String(n).padStart(2,"0")}`;
    batch.set(doc(db,"doors",id), { label:`Depósito ${String(n).padStart(2,"0")}`, type:"deposito", sector:"DEP", sectorLabel:"Depósitos", status:"closed", keyHolder:null, pendingRequest:null });
  }
  await batch.commit();
}

/* ---------- auth anónima ---------- */
onAuthStateChanged(auth, (u) => {
  if (!u) signInAnonymously(auth).catch(err => alert("Error de conexión: " + err.message));
  else boot();
});

async function boot() {
  await seedDoorsIfNeeded();
  onSnapshot(collection(db, "doors"), (snap) => {
    doors = {};
    snap.forEach(d => doors[d.id] = { id: d.id, ...d.data() });
    render();
  });
  onSnapshot(collection(db, "staff"), (snap) => {
    assignments = {};
    snap.forEach(d => assignments[d.id] = d.data().zone);
    render();
  });
  onSnapshot(query(collection(db, "history"), orderBy("executedAt", "desc"), limit(300)), (snap) => {
    history = [];
    snap.forEach(d => history.push({ id: d.id, ...d.data() }));
    render();
  });
}

/* ---------- login ---------- */
let selectedRole = "recorrido";
document.getElementById("role-recorrido").onclick = () => setRole("recorrido");
document.getElementById("role-jefe").onclick = () => setRole("jefe");
function setRole(r){
  selectedRole = r;
  document.getElementById("role-recorrido").style.background = r==="recorrido" ? "var(--brass-soft)" : "#fff";
  document.getElementById("role-recorrido").style.borderColor = r==="recorrido" ? "var(--brass)" : "#D8CFB8";
  document.getElementById("role-jefe").style.background = r==="jefe" ? "var(--brass-soft)" : "#fff";
  document.getElementById("role-jefe").style.borderColor = r==="jefe" ? "var(--brass)" : "#D8CFB8";
}
const loginInput = document.getElementById("login-name");
const loginBtn = document.getElementById("btn-login");
loginInput.oninput = () => loginBtn.disabled = !loginInput.value.trim();
loginBtn.onclick = async () => {
  const name = loginInput.value.trim();
  if (!name) return;
  user = { name, role: selectedRole };
  if (Notification && Notification.permission === "default") { try { await Notification.requestPermission(); } catch(e){} }
  document.getElementById("view-login").classList.add("hidden");
  document.getElementById("view-app").classList.remove("hidden");
  document.getElementById("tab-btn-personal").classList.toggle("hidden", user.role !== "jefe");
  document.getElementById("user-sub").textContent = `${user.name} · ${user.role==="jefe"?"Jefe de oficina":"Recorrido"}`;
  render();
};
document.getElementById("btn-logout").onclick = () => { user = null; location.reload(); };

/* ---------- navegación ---------- */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.onclick = () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
});

/* ---------- notificaciones locales cuando cambia algo en mi piso ---------- */
const notified = new Set();
function checkNotify(){
  if (!user || user.role !== "recorrido") return;
  const myZone = assignments[user.name];
  if (!myZone) return;
  Object.values(doors).filter(d => d.sector===myZone && d.pendingRequest).forEach(d => {
    const key = `${d.id}-${d.pendingRequest.requestedAt}`;
    if (!notified.has(key)) {
      notified.add(key);
      try {
        if (Notification && Notification.permission === "granted") {
          new Notification("Planilla de Llaves", { body: `${d.pendingRequest.requestedBy} pide ${d.pendingRequest.type==="open"?"abrir":"cerrar"} ${d.label}` });
        }
        if (navigator.vibrate) navigator.vibrate([120,60,120]);
      } catch(e){}
    }
  });
}

/* ---------- acciones ---------- */
async function requestChange(doorId, type) {
  await setDoc(doc(db,"doors",doorId), { pendingRequest: { type, requestedBy: user.name, requestedAt: now() } }, { merge: true });
  openDoorId = null; render();
}
async function markDoor(doorId, status) {
  const d = doors[doorId];
  const pr = d.pendingRequest;
  await setDoc(doc(db,"doors",doorId), { status, keyHolder: status==="open" ? user.name : null, pendingRequest: null }, { merge: true });
  await setDoc(doc(collection(db,"history")), {
    doorId, doorLabel: d.label, action: status,
    requestedBy: pr ? pr.requestedBy : null, requestedAt: pr ? pr.requestedAt : null,
    executedBy: user.name, executedAt: now(),
  });
  openDoorId = null; render();
}
async function assignStaff(name, zone) {
  await setDoc(doc(db,"staff",name), { zone });
}

/* ---------- render ---------- */
function render() {
  if (!user) return;
  checkNotify();
  const allDoors = Object.values(doors);
  const pending = allDoors.filter(d => d.pendingRequest).sort((a,b)=>a.pendingRequest.requestedAt-b.pendingRequest.requestedAt);
  const badge = document.getElementById("badge-label");
  badge.textContent = pending.length ? `Solicitudes (${pending.length})` : "Solicitudes";

  ["inicio","sectores","solicitudes","historial","personal"].forEach(t=>{
    document.getElementById("tab-"+t).classList.toggle("hidden", activeTab!==t);
  });

  if (activeTab==="inicio") renderInicio(allDoors, pending);
  if (activeTab==="sectores") renderSectores(allDoors);
  if (activeTab==="solicitudes") renderSolicitudes(pending);
  if (activeTab==="historial") renderHistorial();
  if (activeTab==="personal" && user.role==="jefe") renderPersonal();

  renderDetail();
}

function plateHTML(d) {
  const pr = d.pendingRequest;
  const delayed = pr && (now()-pr.requestedAt>DELAY_MS);
  let dotClass = "", dotColor = d.status==="open" ? "var(--green)" : "var(--red)", tag = "";
  if (pr) {
    dotColor = pr.type==="open" ? "var(--green)" : "var(--red)";
    dotClass = (pr.type==="open"?"pg":"pr") + (delayed ? "f":"");
    dotClass = pr.type==="open" ? (delayed?"pgf":"pg") : (delayed?"prf":"pr");
    tag = `<span class="mono" style="font-size:8px;margin-top:2px;color:${dotColor}">${delayed?"¡demorada!":pr.type==="open"?"piden abrir":"piden cerrar"}</span>`;
  }
  return `<button class="plate" data-door="${d.id}">
    <span class="dot ${dotClass}" style="background:${dotColor}"></span>
    <span class="mono" style="font-size:12px;font-weight:600;">${d.label}</span>${tag}
  </button>`;
}
function bindPlates(root){ root.querySelectorAll("[data-door]").forEach(b=> b.onclick = ()=>{ openDoorId=b.dataset.door; render(); }); }

function renderInicio(allDoors, pending) {
  const el = document.getElementById("tab-inicio");
  const openCount = allDoors.filter(d=>d.status==="open").length;
  const myZone = assignments[user.name];
  const myPending = myZone ? pending.filter(d=>d.sector===myZone) : [];
  const zoneDoors = myZone ? allDoors.filter(d=>d.sector===myZone) : [];

  let html = "";
  if (user.role==="recorrido" && myPending.length) {
    html += myPending.map(d => `
      <button class="card" data-door="${d.id}" style="display:flex;gap:10px;align-items:center;width:100%;margin-bottom:8px;background:${d.pendingRequest.type==="open"?"var(--green-soft)":"var(--red-soft)"};border-color:${d.pendingRequest.type==="open"?"var(--green)":"var(--red)"};text-align:left;">
        <span class="dot ${d.pendingRequest.type==="open"?"pg":"pr"}" style="background:${d.pendingRequest.type==="open"?"var(--green)":"var(--red)"};width:12px;height:12px;"></span>
        <div><p style="font-size:14px;font-weight:700;margin:0;">${d.pendingRequest.requestedBy} pide ${d.pendingRequest.type==="open"?"ABRIR":"CERRAR"} ${d.label}</p>
        <p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">${elapsed(d.pendingRequest.requestedAt)}</p></div>
      </button>`).join("");
  }
  html += `<p class="display" style="font-size:18px;font-weight:700;margin:10px 0;">Resumen</p>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <div class="card" style="flex:1;"><p style="font-size:22px;font-weight:700;color:var(--green);margin:0;">${openCount}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Puertas abiertas</p></div>
      <div class="card" style="flex:1;"><p style="font-size:22px;font-weight:700;margin:0;">${pending.length}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Solicitudes</p></div>
    </div>`;

  if (user.role==="recorrido") {
    html += `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">${myZone?`Mi sector: ${ZONES.find(z=>z.id===myZone)?.label}`:"Sin sector asignado"}</p>`;
    html += myZone ? `<div class="grid4">${zoneDoors.map(plateHTML).join("")}</div>` : `<p style="font-size:13px;color:var(--ink-soft);">Todavía no tenés un piso asignado por el jefe de oficina.</p>`;
  } else if (pending.length) {
    html += `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Solicitudes en curso</p>`;
    html += pending.slice(0,5).map(d=>`<button data-door="${d.id}" style="display:flex;justify-content:space-between;width:100%;padding:8px 0;border-bottom:1px solid #E4DECB;text-align:left;">
      <span style="font-size:13px;">${d.label} · ${d.pendingRequest.type==="open"?"abrir":"cerrar"}</span>
      <span style="font-size:11px;color:var(--ink-soft);">${elapsed(d.pendingRequest.requestedAt)}</span></button>`).join("");
  }
  el.innerHTML = html;
  bindPlates(el);
}

function renderSectores(allDoors) {
  const el = document.getElementById("tab-sectores");
  const shown = allDoors.filter(d=>d.sector===activeSector);
  el.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;">
      ${ZONES.map(z=>`<button class="chip ${activeSector===z.id?"active":""}" data-zone="${z.id}">${z.label}</button>`).join("")}
    </div>
    <div class="grid4">${shown.map(plateHTML).join("")}</div>`;
  el.querySelectorAll("[data-zone]").forEach(b=> b.onclick=()=>{ activeSector=b.dataset.zone; render(); });
  bindPlates(el);
}

function renderSolicitudes(pending) {
  const el = document.getElementById("tab-solicitudes");
  if (!pending.length) { el.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:40px 0;font-size:13px;">No hay solicitudes pendientes.</p>`; return; }
  el.innerHTML = `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Solicitudes pendientes</p>` +
    pending.map(d=>{
      const delayed = now()-d.pendingRequest.requestedAt>DELAY_MS;
      return `<button data-door="${d.id}" class="card" style="display:flex;justify-content:space-between;width:100%;margin-bottom:8px;background:${d.pendingRequest.type==="open"?"var(--green-soft)":"var(--red-soft)"};text-align:left;">
        <div><p style="font-size:14px;font-weight:700;margin:0;">${d.label} · ${d.pendingRequest.type==="open"?"ABRIR":"CERRAR"}</p>
        <p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">pidió ${d.pendingRequest.requestedBy} · ${d.sectorLabel}</p></div>
        <span style="font-size:11px;color:${delayed?"var(--red)":"var(--ink-soft)"};font-weight:${delayed?700:400};align-self:center;">${delayed?"¡demorada! ":""}${elapsed(d.pendingRequest.requestedAt)}</span>
      </button>`;
    }).join("");
  bindPlates(el);
}

function renderHistorial() {
  const el = document.getElementById("tab-historial");
  if (!history.length) { el.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:40px 0;font-size:13px;">Todavía no hay movimientos registrados.</p>`; return; }
  el.innerHTML = `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Historial</p>` +
    history.map(h=>`<div style="padding:8px 0;border-bottom:1px solid #E4DECB;">
      <div style="display:flex;justify-content:space-between;"><span style="font-size:14px;font-weight:600;">${h.doorLabel} · ${h.action==="open"?"Abierta":"Cerrada"}</span>
      <span class="mono" style="font-size:11px;color:var(--ink-soft);">${fmtTime(h.executedAt)}</span></div>
      <p style="font-size:12px;color:var(--ink-soft);margin:2px 0 0;">${h.requestedBy?`pidió ${h.requestedBy}`:"sin solicitud (handy)"} · ejecutó ${h.executedBy}</p>
    </div>`).join("");
}

function renderPersonal() {
  const el = document.getElementById("tab-personal");
  const names = Object.keys(assignments);
  el.innerHTML = `
    <p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Asignar personal a un piso</p>
    <div class="card" style="margin-bottom:20px;">
      <input id="pers-name" placeholder="Nombre del empleado" style="width:100%;border:1px solid #D8CFB8;border-radius:6px;padding:9px 10px;font-size:13px;margin-bottom:8px;" />
      <div id="pers-zones" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
        ${ZONES.map((z,i)=>`<button class="chip pers-zone ${i===0?"active":""}" data-zone="${z.id}" style="font-size:11px;padding:5px 10px;">${z.label}</button>`).join("")}
      </div>
      <button id="pers-add" class="btn-primary" disabled>+ Asignar</button>
    </div>
    <p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Personal asignado</p>
    ${names.length? names.map(n=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #E4DECB;">
        <span style="font-size:13px;">👤 ${n}</span><span style="font-size:12px;color:var(--ink-soft);">${ZONES.find(z=>z.id===assignments[n])?.label}</span>
      </div>`).join("") : `<p style="font-size:13px;color:var(--ink-soft);">Todavía no asignaste a nadie.</p>`}
  `;
  let selZone = ZONES[0].id;
  el.querySelectorAll(".pers-zone").forEach(b=> b.onclick=()=>{ selZone=b.dataset.zone; el.querySelectorAll(".pers-zone").forEach(x=>x.classList.remove("active")); b.classList.add("active"); });
  const nameInput = el.querySelector("#pers-name");
  const addBtn = el.querySelector("#pers-add");
  nameInput.oninput = ()=> addBtn.disabled = !nameInput.value.trim();
  addBtn.onclick = async ()=>{ await assignStaff(nameInput.value.trim(), selZone); nameInput.value=""; addBtn.disabled=true; };
}

function renderDetail() {
  const root = document.getElementById("detail-root");
  if (!openDoorId || !doors[openDoorId]) { root.innerHTML = ""; return; }
  const d = doors[openDoorId];
  const pr = d.pendingRequest;
  const delayed = pr && (now()-pr.requestedAt>DELAY_MS);
  const doorHist = history.filter(h=>h.doorId===d.id).slice(0,5);

  root.innerHTML = `
  <div class="sheet" id="sheet-bg">
    <div class="sheet-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 class="display" style="font-size:20px;font-weight:700;margin:0;">${d.label}</h2>
        <button id="sheet-close" style="font-size:20px;">✕</button>
      </div>
      <p style="margin:0 0 4px;font-weight:600;">Estado actual: ${d.status==="open"?"Abierta 🟢":"Cerrada 🔴"}</p>
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;">🔑 ${d.keyHolder?`Llave en poder de ${d.keyHolder}`:"Llave sin registrar"} · ${d.sectorLabel}</p>

      ${pr ? `<div class="card" style="background:${pr.type==="open"?"var(--green-soft)":"var(--red-soft)"};margin-bottom:16px;">
        <p style="font-weight:700;font-size:13px;margin:0 0 4px;">${delayed?"⚠️ ":"🔔 "}Piden ${pr.type==="open"?"ABRIR":"CERRAR"} ${delayed?"· demorada":""}</p>
        <p style="font-size:12px;color:var(--ink-soft);margin:0;">Lo pidió ${pr.requestedBy} · ${elapsed(pr.requestedAt)}</p>
      </div>` : ""}

      ${user.role==="jefe" ? `
      <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">PEDIR AL PERSONAL DEL PISO</p>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button id="req-open" style="flex:1;padding:10px;border-radius:6px;background:var(--green-soft);font-weight:600;font-size:13px;">🚪 Pedir apertura</button>
        <button id="req-closed" style="flex:1;padding:10px;border-radius:6px;background:var(--red-soft);font-weight:600;font-size:13px;">🚪 Pedir cierre</button>
      </div>` : ""}

      <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">YA LO HICE CON LA LLAVE — MARCAR</p>
      <p style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">Usalo también si te lo pidieron por handy, sin pasar por una solicitud del sistema.</p>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button id="mark-open" style="flex:1;padding:13px;border-radius:6px;background:var(--green);color:#fff;font-weight:700;font-size:14px;">✓ Abierta</button>
        <button id="mark-closed" style="flex:1;padding:13px;border-radius:6px;background:var(--red);color:#fff;font-weight:700;font-size:14px;">✓ Cerrada</button>
      </div>

      ${doorHist.length ? `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">ÚLTIMOS MOVIMIENTOS</p>` +
        doorHist.map(h=>`<div style="font-size:12px;border-top:1px solid #E4DECB;padding:6px 0;">
          <span style="font-weight:600;">${h.action==="open"?"Abierta":"Cerrada"}</span>
          <span class="mono" style="color:var(--ink-soft);"> · ${fmtTime(h.executedAt)}</span>
          <div style="color:var(--ink-soft);">${h.requestedBy?`pidió ${h.requestedBy} · `:"sin solicitud (handy) · "}ejecutó ${h.executedBy}</div>
        </div>`).join("") : ""}
    </div>
  </div>`;

  document.getElementById("sheet-bg").onclick = (e)=>{ if(e.target.id==="sheet-bg"){ openDoorId=null; render(); } };
  document.getElementById("sheet-close").onclick = ()=>{ openDoorId=null; render(); };
  document.getElementById("mark-open").onclick = ()=> markDoor(d.id, "open");
  document.getElementById("mark-closed").onclick = ()=> markDoor(d.id, "closed");
  if (user.role==="jefe") {
    document.getElementById("req-open").onclick = ()=> requestChange(d.id, "open");
    document.getElementById("req-closed").onclick = ()=> requestChange(d.id, "closed");
  }
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
