<style>
  :root{
    --paper:#EDE8DD; --ink:#22303C; --ink-soft:#5B6B73; --brass:#B08D3D; --brass-soft:#E4D6AE;
    --green:#3F8F5F; --green-soft:#DCEEE1; --red:#B5432E; --red-soft:#F3DCD5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);}
  .display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;}
  input{font-family:inherit;}
  .header{background:var(--ink);color:#F7F4EC;padding:20px 16px 12px;border-radius:0 0 14px 14px;display:flex;justify-content:space-between;align-items:center;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .plate{position:relative;background:#F7F4EC;border:1px solid #D8CFB8;border-radius:8px;aspect-ratio:1/0.85;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  .dot{width:10px;height:10px;border-radius:999px;margin-bottom:4px;}
  @keyframes pulseG{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(63,143,95,.5)}50%{opacity:.45;box-shadow:0 0 0 7px rgba(63,143,95,0)}}
  @keyframes pulseR{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(181,67,46,.5)}50%{opacity:.45;box-shadow:0 0 0 7px rgba(181,67,46,0)}}
  .pg{animation:pulseG 1.3s ease-in-out infinite;} .pr{animation:pulseR 1.3s ease-in-out infinite;}
  .pgf{animation:pulseG .7s ease-in-out infinite;} .prf{animation:pulseR .7s ease-in-out infinite;}
  .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;}
  .tabs-inner{max-width:480px;width:100%;background:#fff;border-top:1px solid #D8CFB8;display:flex;justify-content:space-around;padding:8px 4px;}
  .tab-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-soft);position:relative;padding:2px 8px;}
  .tab-btn.active{color:var(--ink);font-weight:600;}
  .sheet{position:fixed;inset:0;background:rgba(34,48,60,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet-inner{max-width:480px;width:100%;max-height:88vh;overflow-y:auto;background:var(--paper);border-radius:16px 16px 0 0;padding:20px;}
  .btn-primary{background:var(--ink);color:#F7F4EC;padding:13px;border-radius:8px;font-weight:600;font-size:15px;width:100%;}
  .btn-primary:disabled{background:#C7BFA9;}
  .card{background:#fff;border:1px solid #D8CFB8;border-radius:10px;padding:12px;}
  .chip{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid #D8CFB8;background:#fff;white-space:nowrap;}
  .chip.active{background:var(--ink);color:#F7F4EC;}
  .hidden{display:none !important;}
  .pin-input{letter-spacing:10px;text-align:center;font-size:22px;width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:12px;}
  .row-btn{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #E4DECB;width:100%;text-align:left;}
</style>

// se mantiene por compatibilidad con el resto del código, siempre apunta a la version mas nueva
const CHANGELOG = VERSION_HISTORY[VERSION_HISTORY.length - 1].changes;
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DIAS_CORTO = [{v:0,l:"Dom"},{v:1,l:"Lun"},{v:2,l:"Mar"},{v:3,l:"Mié"},{v:4,l:"Jue"},{v:5,l:"Vie"},{v:6,l:"Sáb"}];

function now(){ return Date.now(); }
function fmtTime(ts){ if(!ts) return ""; return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function elapsed(ts){ const m=Math.floor((now()-ts)/60000); if(m<1) return "recién"; if(m<60) return `hace ${m} min`; const h=Math.floor(m/60); return `hace ${h} h ${m%60} min`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- sonido / vibración / notificación ---------- */
function playAlert() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (start) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.001, start);
      gain.gain.exponentialRampToValueAtTime(0.35, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start); osc.stop(start + 0.2);
    };
    const t0 = ctx.currentTime;
    beep(t0); beep(t0 + 0.25); beep(t0 + 0.5);
  } catch (e) { /* el navegador bloqueó el audio */ }
}
function notifyUser(title, body) {
  playAlert();
  if (navigator.vibrate) navigator.vibrate([150, 80, 150, 80, 150]);
  try {
    if (typeof Notification !== "undefined" && Notification.permission === "granted") new Notification(title, { body });
  } catch (e) {}
}

const notifiedRequestKeys = new Set();
function checkPendingNotifications() {
  if (!user || !data || user.role !== "recorrido") return;
  const myZones = user.zones || [];
  if (!myZones.length) return;
  Object.values(data.doors).forEach(d => {
    if (d.pendingRequest && myZones.includes(d.sector)) {
      const key = `${d.id}-${d.pendingRequest.requestedAt}`;
      if (!notifiedRequestKeys.has(key)) {
        notifiedRequestKeys.add(key);
        notifyUser("Control Seguridad FADU", `${d.pendingRequest.requestedBy} pide ${d.pendingRequest.type === "open" ? "abrir" : "cerrar"} ${d.label}`);
      }
    }
  });
}

const notifiedNoteKeys = new Set();
let noteCheckInterval = null;
function startNoteChecker() {
  if (noteCheckInterval) return;
  noteCheckInterval = setInterval(() => {
    if (!user || !data) return;
    const d = new Date();
    const nowHM = `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    const todayKey = d.toISOString().slice(0,10);
    const dow = d.getDay();
    (data.notes || []).forEach(n => {
      if (!n.time || n.time !== nowHM) return;
      if (n.recurrence === "semanal" && !(n.daysOfWeek||[]).includes(dow)) return;
      const key = n.recurrence === "semanal" ? `${n.id}-${todayKey}` : n.id;
      if (notifiedNoteKeys.has(key)) return;
      notifiedNoteKeys.add(key);
      notifyUser("Recordatorio · Control Seguridad FADU", n.text);
    });
  }, 20000);
}

/* ---------- construcción del edificio ---------- */
function buildInitialDoors() {
  const doors = {};
  const add = (id, label, sector, sectorLabel, type, routine, hasTV, excludeFromStats) => {
    doors[id] = { id, label, sector, sectorLabel, type, status: "closed", keyHolder: null, pendingRequest: null, routine, hasTV: !!hasTV, clean: false, anomalies: [], excludeFromStats: !!excludeFromStats };
  };
  // Subsuelo: Aula Magna + aulas 1 a 4
  add("SS-MAGNA", "Aula Magna", "SS", "Subsuelo", "aula", true);
  for (let n = 1; n <= 4; n++) add(`SS${n}`, String(n).padStart(2,"0"), "SS", "Subsuelo", "aula", true);
  const TV_100 = ["106","107","109","115","118"];
  for (let n = 101; n <= 124; n++) {
    add(String(n), String(n), "100", "Sector 100", "aula", true, TV_100.includes(String(n)));
    if (n === 111) add("S", "Aula S (Feldman)", "100", "Sector 100", "aula", false);
  }
  const SPLIT = [112, 124]; // puntas del Entrepiso: sus 8 sub-aulas con letra van al sector Auxiliares
  const TV_EP = ["EP101","EP103","EP106","EP109","EP111","EP113","EP115","EP121","EP123"];
  for (let n = 101; n <= 124; n++) {
    if (SPLIT.includes(n)) {
      ["A","B","C","D"].forEach(l => add(`EP${n}${l}`, `EP${n}${l}`, "EP-AUX", "Auxiliares Entrepiso", "aula", true, false));
    } else {
      const id = `EP${n}`;
      add(id, id, "EP", "Entrepiso", "aula", true, TV_EP.includes(id));
    }
    if (n === 110) add("EP-DISENO", "Depósito de Diseño", "EP", "Entrepiso", "deposito", false);
  }
  const TV_200 = ["205","206","207","208","226","228"];
  for (let n = 201; n <= 228; n++) add(String(n), String(n), "200", "Sector 200", "aula", true, TV_200.includes(String(n)));
  for (let n = 1; n <= 38; n++) { const num = String(n).padStart(2,"0"); add(`D${num}`, `Depósito ${num}`, "DEP", "Depósitos", "deposito", true); }
  return doors;
}
const EMPTY_STATE = () => ({ doors: buildInitialDoors(), staff: {}, history: [], catedras: [], notes: [] });

/* ---------- estado en memoria + persistencia (documento único en Firestore) ---------- */
let data = null;
let loaded = false;
let user = null; // { name, role, zones: [] }
let tab = "inicio";
let activeSector = "100";
let sectorStatusFilter = null; // null | "open" | "closed"
let selectedDoorId = null;
let selectionMode = false;
let selectedIds = [];
let noteDraftIds = null;
let filterInicio = null;
let historialFilter = "";
let saving = false;

async function persist() {
  saving = true; render();
  try {
    const clean = JSON.parse(JSON.stringify(data)); // saca cualquier valor "undefined" que Firestore rechazaría
    await setDoc(STATE_DOC, clean);
    document.getElementById("save-error").classList.add("hidden");
  } catch (e) { document.getElementById("save-error").classList.remove("hidden"); }
  finally { saving = false; render(); }
}
function update(mutator) { data = mutator(data); persist(); render(); }

onAuthStateChanged(auth, (u) => { if (!u) signInAnonymously(auth).catch(e => alert("Error de conexión: " + e.message)); else boot(); });

// Vuelve a calcular los datos "de fábrica" de cada puerta (nombre, sector, si tiene TV, si es de rutina, etc.)
// a partir del código actual, pero conserva el estado real (abierta/cerrada, llave, pedidos, limpieza, anomalías).
// Así, cuando agregamos o corregimos algo en el código (ej: un ícono de TV que faltaba), se autocorrige solo
// en cualquier celular que ya tenía datos guardados, sin que haya que borrar nada a mano.
function reconcileDoors(storedDoors) {
  const canonical = buildInitialDoors();
  const result = {};
  Object.keys(canonical).forEach(id => {
    const c = canonical[id];
    const s = storedDoors[id];
    const pr = s && s.pendingRequest ? { ...s.pendingRequest, catedra: s.pendingRequest.catedra || null } : (s ? s.pendingRequest : c.pendingRequest);
    result[id] = {
      ...c,
      status: s ? s.status : c.status,
      keyHolder: s ? s.keyHolder : c.keyHolder,
      pendingRequest: pr,
      clean: s ? !!s.clean : c.clean,
      anomalies: s && s.anomalies ? s.anomalies : c.anomalies,
    };
  });
  return result;
}

// Corrige cualquier dato que haya quedado con una forma rara (ej: algo que debería ser una lista y no lo es).
// Si detecta algo raro, lo arregla localmente y avisa para que boot() lo vuelva a guardar ya reparado.
// las catedras cargadas antes de la version 1.10.0 no tenian "id" propio -> tocarlas no hacia nada
// (la busqueda por id fallaba en silencio). Esto les asigna uno estable la primera vez que se detectan.
function ensureCatedraIds(list) {
  let changed = false;
  const result = (list || []).map(c => {
    if (typeof c === "string") return c; // las de solo texto usan su propio texto como id, no necesitan nada mas
    if (c && c.id) return c;
    changed = true;
    return { ...c, id: `cat-legacy-${now()}-${Math.random().toString(36).slice(2,6)}` };
  });
  return { result, changed };
}

function sanitizeState(raw) {
  let repaired = false;
  let doors = (raw.doors && typeof raw.doors === "object" && !Array.isArray(raw.doors)) ? { ...raw.doors } : {};
  if (!raw.doors || typeof raw.doors !== "object" || Array.isArray(raw.doors)) repaired = true;
  Object.keys(doors).forEach(id => {
    const d = doors[id];
    if (!d || typeof d !== "object") { delete doors[id]; repaired = true; return; }
    if (d.pendingRequest && (typeof d.pendingRequest !== "object" || Array.isArray(d.pendingRequest) || !d.pendingRequest.type)) { doors[id] = { ...d, pendingRequest: null }; repaired = true; }
    if (!Array.isArray(d.anomalies)) { doors[id] = { ...doors[id], anomalies: [] }; repaired = true; }
  });
  let staff = (raw.staff && typeof raw.staff === "object" && !Array.isArray(raw.staff)) ? raw.staff : {};
  if (!raw.staff || typeof raw.staff !== "object" || Array.isArray(raw.staff)) repaired = true;
  let history = Array.isArray(raw.history) ? raw.history.filter(h => h && typeof h === "object" && h.doorId) : [];
  if (!Array.isArray(raw.history)) repaired = true;
  let catedras = Array.isArray(raw.catedras) ? raw.catedras.filter(c => typeof c === "string" || (c && typeof c === "object" && typeof c.name === "string")) : [];
  if (!Array.isArray(raw.catedras)) repaired = true;
  let notes = Array.isArray(raw.notes) ? raw.notes.filter(n => n && typeof n === "object" && n.text) : [];
  if (!Array.isArray(raw.notes)) repaired = true;
  return { sane: { doors, staff, history, catedras, notes }, repaired };
}

const SESSION_KEY = "fadu-session";
function saveSession(name) { try { localStorage.setItem(SESSION_KEY, JSON.stringify({ name, ts: Date.now() })); } catch(e){} }
function loadSessionName() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (Date.now() - s.ts > 24 * 60 * 60 * 1000) return null;
    return s.name;
  } catch (e) { return null; }
}
function clearSession() { try { localStorage.removeItem(SESSION_KEY); } catch(e){} }

async function boot() {
  const snap = await getDoc(STATE_DOC);
  let needsRepair = false;
  if (!snap.exists()) {
    data = EMPTY_STATE();
    await setDoc(STATE_DOC, JSON.parse(JSON.stringify(data)));
  } else {
    const raw = snap.data();
    const { sane, repaired } = sanitizeState(raw);
    const { result: catedras, changed: catChanged } = ensureCatedraIds(sane.catedras);
    needsRepair = repaired || catChanged;
    data = { doors: reconcileDoors(sane.doors), staff: sane.staff, history: sane.history, catedras, notes: sane.notes };
  }
  loaded = true;
  if (needsRepair) {
    try { await setDoc(STATE_DOC, JSON.parse(JSON.stringify(data))); } catch (e) {}
  }
  const savedName = loadSessionName();
  if (savedName && data.staff[savedName]) { loginAs(savedName, data.staff[savedName]); }
  else { render(); }
  onSnapshot(STATE_DOC, (snap) => {
    if (!snap.exists()) return;
    const raw = snap.data();
    const { sane, repaired } = sanitizeState(raw);
    const { result: catedras, changed: catChanged } = ensureCatedraIds(sane.catedras);
    data = { doors: reconcileDoors(sane.doors), staff: sane.staff, history: sane.history, catedras, notes: sane.notes };
    render();
    if (repaired || catChanged) { try { setDoc(STATE_DOC, JSON.parse(JSON.stringify(data))); } catch (e) {} }
  });
}

/* ---------- acciones ---------- */
function requestChange(doorId, type, catedra) {
  update(prev => ({ ...prev, doors: { ...prev.doors, [doorId]: { ...prev.doors[doorId], pendingRequest: { type, requestedBy: user.name, requestedAt: now(), catedra: catedra || null } } } }));
  selectedDoorId = null; render();
}
function markDoor(doorId, status, clean) {
  update(prev => {
    const d = prev.doors[doorId]; const pr = d.pendingRequest;
    const entry = { id:`${doorId}-${now()}`, doorId, doorLabel:d.label, action:status, requestedBy: pr?pr.requestedBy:null, requestedAt: pr?pr.requestedAt:null, catedra: (pr && pr.catedra) ? pr.catedra : null, executedBy:user.name, executedAt: now() };
    return { ...prev,
      doors: { ...prev.doors, [doorId]: { ...d, status, keyHolder: status==="open"?user.name:null, pendingRequest:null, clean: status==="closed" ? !!clean : false } },
      history: [entry, ...prev.history].slice(0,300) };
  });
  selectedDoorId = null; render();
}
function reportAnomaly(doorId, text) {
  update(prev => {
    const d = prev.doors[doorId];
    const anomaly = { id:`${doorId}-an-${now()}`, text, reportedBy:user.name, reportedAt:now(), resolved:false };
    return { ...prev, doors: { ...prev.doors, [doorId]: { ...d, anomalies: [anomaly, ...(d.anomalies||[])] } } };
  });
}
function resolveAnomaly(doorId, anomalyId) {
  update(prev => { const d = prev.doors[doorId]; return { ...prev, doors: { ...prev.doors, [doorId]: { ...d, anomalies: (d.anomalies||[]).map(a=>a.id===anomalyId?{...a,resolved:true}:a) } } }; });
}
function saveStaff(name, fields) { update(prev => ({ ...prev, staff: { ...prev.staff, [name]: { ...(prev.staff[name]||{}), ...fields } } })); }
function deleteStaff(name) { update(prev => { const s = {...prev.staff}; delete s[name]; return {...prev, staff:s}; }); }
function addCatedra(cObj) {
  update(prev => {
    const list = prev.catedras || [];
    const label = cObj.materia ? `${cObj.name} - ${cObj.materia}` : cObj.name;
    if (list.some(c => catedraLabel(c) === label)) return prev;
    const withId = { id: `cat-${now()}-${Math.random().toString(36).slice(2,6)}`, ...cObj };
    return { ...prev, catedras: [...list, withId] };
  });
}
function removeCatedra(id) { update(prev => ({ ...prev, catedras: (prev.catedras||[]).filter(c=>catedraId(c)!==id) })); }
function renameCatedra(id, fields) {
  update(prev => {
    const old = (prev.catedras||[]).find(c => catedraId(c)===id);
    const oldLabel = old ? catedraLabel(old) : null;
    const newLabel = fields.materia ? `${fields.name} - ${fields.materia}` : fields.name;
    const catedras = (prev.catedras||[]).map(c => catedraId(c)===id ? { ...c, ...fields, id } : c);
    const doors = { ...prev.doors };
    if (oldLabel && oldLabel !== newLabel) {
      Object.keys(doors).forEach(did => { if (doors[did].pendingRequest && doors[did].pendingRequest.catedra===oldLabel) doors[did] = { ...doors[did], pendingRequest: { ...doors[did].pendingRequest, catedra:newLabel } }; });
    }
    const history = (oldLabel && oldLabel !== newLabel) ? prev.history.map(h => h.catedra===oldLabel ? {...h, catedra:newLabel} : h) : prev.history;
    return { ...prev, catedras, doors, history };
  });
}
// una catedra vieja podia ser solo texto, o un objeto con "turno" (singular). Estas funciones
// entienden los 3 formatos para no perder nada de lo ya cargado.
function catedraId(c) { return typeof c === "string" ? c : (c.id || catedraLabel(c)); }
function catedraName(c) { return typeof c === "string" ? c : c.name; }
function catedraMateria(c) { return typeof c === "string" ? null : (c.materia || null); }
function catedraAula(c) { return typeof c === "string" ? null : (c.aula || null); }
function aulaLabel(id) { return id ? (data.doors[id]?.label || id) : null; }
// campo de texto con sugerencias en vivo de las aulas/depositos reales, en vez de un select o texto libre
function aulaAutocompleteHTML(inputId, sugId, initialId) {
  return `<div style="position:relative;margin-bottom:10px;">
    <input id="${inputId}" value="${esc(aulaLabel(initialId) || "")}" placeholder="Aula habitual (opcional) — escribí para buscar" autocomplete="off"
      style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:9px 12px;font-size:13px;" />
    <div id="${sugId}" class="hidden" style="position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #D8CFB8;border-radius:8px;max-height:180px;overflow-y:auto;z-index:5;margin-top:2px;"></div>
  </div>`;
}
// conecta el input+sugerencias. Devuelve un objeto con getId() para leer el aula elegida al guardar.
function bindAulaAutocomplete(inputId, sugId, initialId) {
  const inputEl = document.getElementById(inputId), sugEl = document.getElementById(sugId);
  let selectedId = initialId || null;
  const renderSuggestions = (query) => {
    const q = query.trim().toLowerCase();
    if (!q) { sugEl.innerHTML = ""; sugEl.classList.add("hidden"); return; }
    const matches = Object.values(data.doors).filter(d => d.label.toLowerCase().includes(q) || d.sectorLabel.toLowerCase().includes(q))
      .sort((a,b)=>a.label.localeCompare(b.label,"es",{numeric:true})).slice(0, 8);
    if (!matches.length) { sugEl.innerHTML = `<p style="font-size:12px;color:var(--ink-soft);padding:8px 10px;margin:0;">Sin resultados.</p>`; sugEl.classList.remove("hidden"); return; }
    sugEl.innerHTML = matches.map(d => `<button type="button" class="aula-suggestion" data-id="${esc(d.id)}" style="display:flex;justify-content:space-between;width:100%;padding:8px 10px;border-bottom:1px solid #E4DECB;text-align:left;background:#fff;">
        <span style="font-size:13px;">${esc(d.label)}</span><span style="font-size:11px;color:var(--ink-soft);">${esc(d.sectorLabel)}</span>
      </button>`).join("");
    sugEl.classList.remove("hidden");
    sugEl.querySelectorAll(".aula-suggestion").forEach(b => b.onclick = () => {
      selectedId = b.dataset.id;
      inputEl.value = aulaLabel(selectedId);
      sugEl.innerHTML = ""; sugEl.classList.add("hidden");
    });
  };
  inputEl.oninput = () => { selectedId = null; renderSuggestions(inputEl.value); };
  inputEl.onfocus = () => { if (inputEl.value) renderSuggestions(inputEl.value); };
  inputEl.onblur = () => { setTimeout(() => sugEl.classList.add("hidden"), 150); }; // delay para que el click en la sugerencia llegue a tiempo
  return { getId: () => selectedId };
}
function catedraLabel(c) { const n = catedraName(c), m = catedraMateria(c); return m ? `${n} - ${m}` : n; }
function catedraTurnos(c) {
  if (typeof c === "string") return [];
  if (Array.isArray(c.turnos)) return c.turnos;
  if (c.turno) return [c.turno]; // formato viejo (un solo turno)
  return [];
}
function catedraDias(c) { return typeof c === "string" ? [] : (c.dias || []); }
function staffTurnos(s) {
  if (!s) return [];
  if (Array.isArray(s.turnos)) return s.turnos;
  if (s.turno) return [s.turno]; // formato viejo (un solo turno)
  return [];
}

/* ---------- permisos ---------- */
// "test" es la unica cuenta que puede otorgar o quitar permisos especiales a cualquiera, propios o ajenos.
const SUPERUSER_NAME = "test";
// lista de capacidades que se pueden otorgar. Se modelan como lista (permisosExtra: ["gestionCatedras"]),
// no como campos sueltos, para poder sumar capacidades nuevas sin rediseñar nada.
const CAPABILITIES = [
  { id: "gestionCatedras", label: "Gestionar el catálogo general de cátedras (crear, editar, borrar para todos)" },
];
function isSuperuser(u) { return !!(u && u.name && u.name.toLowerCase() === SUPERUSER_NAME); }
function hasPermission(u, cap) {
  if (!u) return false;
  if (isSuperuser(u)) return true; // el superusuario puede todo, sin necesidad de otorgarselo
  return !!(u.permisosExtra && u.permisosExtra.includes(cap));
}

// las catedras sin turno/dia cargado siguen mostrandose siempre (compatibilidad con lo ya cargado).
// las que sí tienen turno, solo se muestran si algún turno coincide con los de quien pide (o si quien
// pide no tiene ningún turno cargado, en cuyo caso se muestran todas para no ocultar nada por error).
function catedrasForToday() {
  const list = data.catedras || [];
  const today = new Date().getDay();
  const myTurnos = (user && user.turnos) || [];
  return list.filter(c => {
    const turnos = catedraTurnos(c), dias = catedraDias(c);
    const turnoOk = !turnos.length || !myTurnos.length || turnos.some(t => myTurnos.includes(t));
    const diaOk = !dias.length || dias.includes(today);
    return turnoOk && diaOk;
  });
}
function addNote(note) { update(prev => ({ ...prev, notes: [{ id:`note-${now()}`, createdBy:user.name, createdAt:now(), doorIds: note.doorIds||[], dismissedOccurrences: [], ...note }, ...(prev.notes||[])] })); }
function deleteNote(id) { update(prev => ({ ...prev, notes: (prev.notes||[]).filter(n=>n.id!==id) })); }
function dismissNote(id, occurrenceKey) {
  update(prev => ({ ...prev, notes: (prev.notes||[]).map(n => n.id===id ? { ...n, dismissedOccurrences: [...(n.dismissedOccurrences||[]), occurrenceKey] } : n) }));
}

function todayDateStr(d) { return (d||new Date()).toISOString().slice(0,10); }
function occurrenceKeyFor(note, dateStr) { return note.recurrence === "semanal" ? `${note.id}|${dateStr}` : note.id; }
function isNoteActiveNow(note, d) {
  const dow = d.getDay();
  if (note.recurrence === "semanal" && !(note.daysOfWeek||[]).includes(dow)) return false;
  if (note.time) {
    const [hh, mm] = note.time.split(":").map(Number);
    const target = new Date(d); target.setHours(hh, mm - 30, 0, 0);
    if (d < target) return false;
  }
  const key = occurrenceKeyFor(note, todayDateStr(d));
  if ((note.dismissedOccurrences||[]).includes(key)) return false;
  return true;
}

function confirmIfAlreadyInState(doorsArr, status) {
  const already = doorsArr.filter(d => d.status === status && !d.pendingRequest);
  if (already.length === 0) return true;
  const accion = status === "open" ? "abierta" : "cerrada";
  const pedir = status === "open" ? "apertura" : "cierre";
  if (already.length === 1) return confirm(`${already[0].label} ya está ${accion}. ¿Igual querés pedir la ${pedir}?`);
  return confirm(`${already.length} de las aulas seleccionadas ya están ${accion}s. ¿Igual querés pedir la ${pedir}?`);
}

function confirmIfMismatch(doorsArr, status) {
  const mismatched = doorsArr.filter(d => d.pendingRequest && d.pendingRequest.type !== status);
  if (mismatched.length === 0) return true;
  const pedido = status === "open" ? "cerrar" : "abrir";
  const accion = status === "open" ? "abierta" : "cerrada";
  if (mismatched.length === 1) return confirm(`Solicitaron ${pedido} ${mismatched[0].label}. ¿Está seguro que quiere marcarla ${accion}?`);
  return confirm(`${mismatched.length} de las puertas seleccionadas tienen pedido para ${pedido}. ¿Está seguro que quiere marcarlas ${accion}?`);
}

function startSelection(id) { selectionMode = true; selectedIds = [id]; render(); }
function toggleSelect(id) { selectedIds = selectedIds.includes(id) ? selectedIds.filter(x=>x!==id) : [...selectedIds, id]; render(); }
function clearSelection() { selectionMode = false; selectedIds = []; render(); }
function bulkRequest(type) {
  update(prev => { const doors = {...prev.doors}; selectedIds.forEach(id => { doors[id] = {...doors[id], pendingRequest:{type, requestedBy:user.name, requestedAt:now(), catedra:null}}; }); return {...prev, doors}; });
  clearSelection();
}
function bulkMark(status, clean) {
  update(prev => {
    const doors = {...prev.doors}; const entries = [];
    selectedIds.forEach(id => {
      const d = doors[id]; const pr = d.pendingRequest;
      entries.push({ id:`${id}-${now()}-${Math.random().toString(36).slice(2,6)}`, doorId:id, doorLabel:d.label, action:status, requestedBy:pr?pr.requestedBy:null, requestedAt:pr?pr.requestedAt:null, catedra: (pr && pr.catedra) ? pr.catedra : null, executedBy:user.name, executedAt:now() });
      doors[id] = { ...d, status, keyHolder: status==="open"?user.name:null, pendingRequest:null, clean: status==="closed" ? !!clean : false };
    });
    return { ...prev, doors, history: [...entries, ...prev.history].slice(0,300) };
  });
  clearSelection();
}

/* ---------- placas de puerta ---------- */
let pressTimer = null, firedLongPress = false;
function plateHTML(d) {
  const pr = d.pendingRequest;
  const delayed = pr && (now()-pr.requestedAt>DELAY_MS);
  let dotColor = d.status==="open" ? "var(--green)" : "var(--red)";
  let dotClass = "", tag = "";
  if (pr) {
    dotColor = pr.type==="open" ? "var(--green)" : "var(--red)";
    dotClass = pr.type==="open" ? (delayed?"pgf":"pg") : (delayed?"prf":"pr");
    tag = `<span class="mono" style="font-size:8px;margin-top:2px;color:${dotColor}">${delayed?"¡demorada!":pr.type==="open"?"piden abrir":"piden cerrar"}</span>`;
  }
  const selected = selectedIds.includes(d.id);
  const hasNotes = (data.notes||[]).some(n => n.doorIds && n.doorIds.includes(d.id));
  return `<button class="plate" data-door="${d.id}"
      style="${selected?'background:var(--brass-soft);border-color:var(--brass);border-width:2px;':''}">
    ${d.hasTV ? '<span style="position:absolute;top:3px;left:3px;font-size:10px;">📺</span>' : ''}
    ${(d.anomalies||[]).some(a=>!a.resolved) ? '<span style="position:absolute;bottom:3px;right:3px;font-size:10px;">⚠️</span>' : ''}
    ${d.status==="closed" && d.clean ? '<span style="position:absolute;bottom:3px;left:3px;font-size:10px;">✅</span>' : ''}
    ${selectionMode ? `<span style="position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:4px;border:1px solid var(--brass);background:${selected?'var(--brass)':'#fff'};color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;">${selected?'✓':''}</span>` : (hasNotes ? '<span style="position:absolute;top:3px;right:3px;font-size:10px;">📝</span>' : '')}
    <span class="dot ${dotClass}" style="background:${dotColor}"></span>
    <span class="mono" style="font-size:11px;font-weight:600;text-align:center;line-height:1.1;">${esc(d.label)}</span>${tag}
  </button>`;
}
function bindPlates(root) {
  root.querySelectorAll("[data-door]").forEach(b => {
    const id = b.dataset.door;
    const start = () => { firedLongPress = false; pressTimer = setTimeout(() => { firedLongPress = true; startSelection(id); if (navigator.vibrate) navigator.vibrate(25); }, 450); };
    const cancel = () => { if (pressTimer) clearTimeout(pressTimer); };
    b.addEventListener("touchstart", start); b.addEventListener("touchend", cancel); b.addEventListener("touchmove", cancel);
    b.addEventListener("mousedown", start); b.addEventListener("mouseup", cancel); b.addEventListener("mouseleave", cancel);
    b.addEventListener("contextmenu", e => e.preventDefault());
    b.onclick = () => { if (firedLongPress) { firedLongPress = false; return; } if (selectionMode) toggleSelect(id); else { selectedDoorId = id; render(); } };
  });
}

/* ---------- render principal ---------- */
function render() {
  if (!loaded) return;
  if (!user) { renderLogin(); return; }

  checkPendingNotifications();
  const allDoors = Object.values(data.doors);
  const pendingList = allDoors.filter(d=>d.pendingRequest).sort((a,b)=>a.pendingRequest.requestedAt-b.pendingRequest.requestedAt);
  document.getElementById("badge-label").textContent = pendingList.length ? `Solicitudes (${pendingList.length})` : "Solicitudes";
  document.getElementById("tabs-nav").classList.toggle("hidden", selectionMode);
  document.getElementById("user-sub").textContent = `${user.name} · ${user.role==="jefe"?"Oficina Seguridad":"Pisos"} ${saving?"· guardando…":""}`;

  const root = document.getElementById("content-root");
  root.style.paddingBottom = selectionMode ? "230px" : "76px";
  if (tab==="inicio") root.innerHTML = renderInicio(allDoors, pendingList);
  if (tab==="sectores") root.innerHTML = renderSectores(allDoors);
  if (tab==="solicitudes") root.innerHTML = renderSolicitudes(pendingList);
  if (tab==="historial") root.innerHTML = renderHistorial();
  if (tab==="personal" && (user.role==="jefe" || isSuperuser(user))) root.innerHTML = renderPersonal();
  bindTabHandlers(root);
  bindPlates(root);

  renderSelectionBar(pendingList);
  renderDoorDetail();
}

  } else if (pendingList.length) {

    </div>`).join("");
}

function bindHistorialSearch(root) {

/* ---------- handlers por pestaña ---------- */
function bindTabHandlers(root) {
  if (tab==="inicio") {
    root.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filterInicio = filterInicio===b.dataset.filter?null:b.dataset.filter; render(); });
    root.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { tab = b.dataset.goto; document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active", x.dataset.tab===tab)); render(); });
    root.querySelectorAll("[data-close-note]").forEach(b => b.onclick = () => {
      const n = (data.notes||[]).find(x=>x.id===b.dataset.closeNote);
      if (n) dismissNote(n.id, occurrenceKeyFor(n, todayDateStr(new Date())));
    });
    const seeAllBtn = document.getElementById("see-all-notes");
    if (seeAllBtn) seeAllBtn.onclick = () => renderAllNotesSheet();
    const toggleBtn = document.getElementById("toggle-note-form");
    if (toggleBtn) toggleBtn.onclick = () => {
      const r = document.getElementById("note-form-root");
      if (r.innerHTML) { r.innerHTML = ""; return; }
      r.innerHTML = noteFormHTML();
      bindNoteForm(r, (note) => { addNote(note); r.innerHTML = ""; });
    };
  }
  if (tab==="sectores") {
    root.querySelectorAll(".sector-pick").forEach(b => b.onclick = () => { activeSector = b.dataset.zone; render(); });
    const openBtn = document.getElementById("filter-open-toggle");
    if (openBtn) openBtn.onclick = () => { sectorStatusFilter = sectorStatusFilter==="open" ? null : "open"; render(); };
    const closedBtn = document.getElementById("filter-closed-toggle");
    if (closedBtn) closedBtn.onclick = () => { sectorStatusFilter = sectorStatusFilter==="closed" ? null : "closed"; render(); };
  }
  if (tab==="historial") bindHistorialSearch(root);
  if (tab==="personal" && (user.role==="jefe" || isSuperuser(user))) {
    const addBtn = document.getElementById("add-staff-btn");
    if (addBtn) addBtn.onclick = () => openStaffSheet(null);
    root.querySelectorAll("[data-edit-staff]").forEach(b => b.onclick = () => openStaffSheet(b.dataset.editStaff));
    root.querySelectorAll("[data-edit-catedra]").forEach(b => b.onclick = () => openCatedraSheet(b.dataset.editCatedra));
    const ci = document.getElementById("new-catedra-input"), cb = document.getElementById("new-catedra-btn");
    const cMateria = document.getElementById("new-catedra-materia");
    const aulaAc = document.getElementById("new-catedra-aula") ? bindAulaAutocomplete("new-catedra-aula", "new-catedra-aula-sug", null) : null;
    if (cb) {
      let newCatTurnos = [], newCatDias = [];
      const check = () => cb.disabled = !ci.value.trim();
      ci.oninput = check;
      root.querySelectorAll(".newcat-turno").forEach(b => b.onclick = () => { const t = b.dataset.newcatTurno; newCatTurnos = newCatTurnos.includes(t) ? newCatTurnos.filter(x=>x!==t) : [...newCatTurnos, t]; b.classList.toggle("active", newCatTurnos.includes(t)); });
      root.querySelectorAll(".newcat-day").forEach(b => b.onclick = () => {
        const d = parseInt(b.dataset.newcatDay);
        newCatDias = newCatDias.includes(d) ? newCatDias.filter(x=>x!==d) : [...newCatDias, d].sort();
        b.classList.toggle("active", newCatDias.includes(d));
      });
      cb.onclick = () => {
        if (!ci.value.trim()) return;
        addCatedra({ name: ci.value.trim(), materia: cMateria.value.trim() || null, aula: aulaAc ? aulaAc.getId() : null, turnos: newCatTurnos, dias: newCatDias });
        ci.value = ""; cMateria.value = ""; document.getElementById("new-catedra-aula").value = ""; newCatTurnos = []; newCatDias = [];
        root.querySelectorAll(".newcat-turno, .newcat-day").forEach(x=>x.classList.remove("active"));
        check();
      };
    }
    root.querySelectorAll(".perm-toggle").forEach(cbx => cbx.onchange = () => {
      const name = cbx.dataset.staff, cap = cbx.dataset.cap;
      const current = (data.staff[name] && data.staff[name].permisosExtra) || [];
      const next = cbx.checked ? [...new Set([...current, cap])] : current.filter(c => c !== cap);
      saveStaff(name, { permisosExtra: next });
    });
  }
}

function bindNoteForm(root, onSave) {
  let recurrence = "unica", daysOfWeek = [5];
  const textI = root.querySelector("#note-text"), saveBtn = root.querySelector("#note-save");
  const recU = root.querySelector("#note-rec-unica"), recS = root.querySelector("#note-rec-semanal"), daysWrap = root.querySelector("#note-days");
  const checkValid = () => saveBtn.disabled = !textI.value.trim() || (recurrence==="semanal" && daysOfWeek.length===0);
  textI.oninput = checkValid;
  recU.onclick = () => { recurrence="unica"; recU.classList.add("active"); recS.classList.remove("active"); daysWrap.classList.add("hidden"); checkValid(); };
  recS.onclick = () => { recurrence="semanal"; recS.classList.add("active"); recU.classList.remove("active"); daysWrap.classList.remove("hidden"); checkValid(); };
  root.querySelectorAll(".note-day").forEach(b => b.onclick = () => {
    const v = parseInt(b.dataset.day);
    if (daysOfWeek.includes(v)) { daysOfWeek = daysOfWeek.filter(x=>x!==v); b.style.background=""; b.textContent = DIAS_CORTO.find(d=>d.v===v).l; }
    else { daysOfWeek = [...daysOfWeek, v].sort(); b.style.background="var(--brass-soft)"; b.textContent = "✓ " + DIAS_CORTO.find(d=>d.v===v).l; }
    checkValid();
  });
  saveBtn.onclick = () => onSave({ text: textI.value.trim(), recurrence, daysOfWeek: recurrence==="semanal"?daysOfWeek:[], time: root.querySelector("#note-time").value || null });
}

      ${!name ? `<label class="mono" style="font-size:11px;color:var(--ink-soft);">NOMBRE Y APELLIDO</label>
        <input id="staff-name" placeholder="Ej: Marcelo Gómez" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:11px 12px;font-size:14px;margin:6px 0 16px;" />
        <p style="font-size:11px;color:var(--ink-soft);margin:-10px 0 16px;">Esta persona va a elegir su propio PIN la primera vez que entre.</p>` : ""}
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">ROL</label>
      <div style="display:flex;gap:8px;margin:8px 0 16px;">
        <button id="staff-role-recorrido" class="chip ${role==='recorrido'?'active':''}" style="flex:1;">🚶 Pisos</button>
        <button id="staff-role-jefe" class="chip ${role==='jefe'?'active':''}" style="flex:1;">👔 Oficina Seguridad</button>
      </div>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">TURNO (podés elegir más de uno)</label>
      <div style="display:flex;gap:8px;margin:8px 0 16px;">
        <button data-turno="manana" class="chip staff-turno ${turnos.includes('manana')?'active':''}" style="flex:1;">☀️ Mañana</button>
        <button data-turno="tarde" class="chip staff-turno ${turnos.includes('tarde')?'active':''}" style="flex:1;">🌤️ Tarde</button>
        <button data-turno="noche" class="chip staff-turno ${turnos.includes('noche')?'active':''}" style="flex:1;">🌙 Noche</button>
      </div>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">PISOS ASIGNADOS (podés elegir más de uno)</label>
      <div id="staff-zones" style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 20px;">
        ${ZONES.map(z=>`<button class="chip staff-zone ${zones.includes(z.id)?'active':''}" data-zone="${z.id}">${zones.includes(z.id)?'✓ ':''}${z.label}</button>`).join("")}
      </div>
      ${name ? `<button id="staff-reset-pin" style="width:100%;margin-bottom:12px;padding:12px;border-radius:8px;color:var(--ink);font-weight:600;font-size:13px;border:1px solid var(--brass);">🔑 Blanquear PIN (se lo olvidó)</button>` : ""}
      <button id="staff-save" class="btn-primary" ${name?'':'disabled'}>${name?"Guardar cambios":"Crear persona"}</button>
      ${name?`<button id="staff-delete" style="width:100%;margin-top:10px;padding:12px;border-radius:8px;color:var(--red);font-weight:600;font-size:13px;border:1px solid var(--red-soft);">Eliminar persona</button>`:""}
    </div></div>`;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("staff-close").onclick = close;
  document.getElementById("staff-sheet-bg").onclick = (e) => { if (e.target.id==="staff-sheet-bg") close(); };
  const rRec = document.getElementById("staff-role-recorrido"), rJefe = document.getElementById("staff-role-jefe");
  rRec.onclick = () => { role="recorrido"; rRec.classList.add("active"); rJefe.classList.remove("active"); };
  rJefe.onclick = () => { role="jefe"; rJefe.classList.add("active"); rRec.classList.remove("active"); };
  root.querySelectorAll(".staff-turno").forEach(b => b.onclick = () => { const t = b.dataset.turno; turnos = turnos.includes(t) ? turnos.filter(x=>x!==t) : [...turnos, t]; b.classList.toggle("active", turnos.includes(t)); });
  root.querySelectorAll(".staff-zone").forEach(b => b.onclick = () => {
    const z = b.dataset.zone;
    zones = zones.includes(z) ? zones.filter(x=>x!==z) : [...zones, z];
    root.querySelectorAll(".staff-zone").forEach(x => { const zz = ZONES.find(zo=>zo.id===x.dataset.zone); x.classList.toggle("active", zones.includes(x.dataset.zone)); x.textContent = (zones.includes(x.dataset.zone)?'✓ ':'') + zz.label; });
  });
  const resetPinBtn = document.getElementById("staff-reset-pin");
  if (resetPinBtn) resetPinBtn.onclick = () => { if (confirm(`¿Blanquear el PIN de ${name}? La próxima vez que entre va a tener que elegir uno nuevo.`)) { saveStaff(name, { pin: null }); close(); } };
  const saveBtn = document.getElementById("staff-save");
  const nameI = document.getElementById("staff-name");
  if (nameI) nameI.oninput = () => saveBtn.disabled = !nameI.value.trim();
  saveBtn.onclick = () => {
    const id = name || nameI.value.trim();
    if (!name && data.staff[id]) { alert("Ya existe una persona con ese nombre."); return; }
    saveStaff(id, name ? { role, zones, turnos } : { role, zones, turnos, pin: null });
    close();
  };
  const delBtn = document.getElementById("staff-delete");
  if (delBtn) delBtn.onclick = () => { if (confirm(`¿Eliminar a ${name}?`)) { deleteStaff(name); close(); } };
}

function openCatedraSheet(id) {
  const existing = (data.catedras||[]).find(c => catedraId(c) === id);
  if (!existing) return;
  let turnos = catedraTurnos(existing);
  let dias = [...catedraDias(existing)];
  const root = document.getElementById("detail-root");
  root.innerHTML = `<div class="sheet" id="cat-sheet-bg"><div class="sheet-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 class="display" style="font-size:20px;font-weight:700;margin:0;">Editar cátedra</h2>
        <button id="cat-close" style="font-size:20px;">✕</button>
      </div>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">NOMBRE</label>
      <input id="cat-name" value="${esc(catedraName(existing))}" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:11px 12px;font-size:14px;margin:6px 0 10px;" />
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">MATERIA (opcional)</label>
      <input id="cat-materia" value="${esc(catedraMateria(existing) || "")}" placeholder="Ej: Cálculo" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:11px 12px;font-size:14px;margin:6px 0 10px;" />
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">AULA HABITUAL (opcional)</label>
      ${aulaAutocompleteHTML("cat-aula", "cat-aula-sug", catedraAula(existing))}
      <p id="cat-error" class="hidden" style="font-size:11px;color:var(--red);margin-bottom:10px;">Ya existe una cátedra con ese nombre y esa materia.</p>
      <p style="font-size:11px;color:var(--ink-soft);margin-bottom:16px;">Los pedidos y el historial ya cargados con este nombre se actualizan solos si lo cambiás.</p>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">TURNO (podés elegir más de uno)</label>
      <div style="display:flex;gap:6px;margin:8px 0 16px;">
        <button data-cat-turno="manana" class="chip cat-turno ${turnos.includes('manana')?'active':''}" style="flex:1;font-size:12px;">☀️ Mañana</button>
        <button data-cat-turno="tarde" class="chip cat-turno ${turnos.includes('tarde')?'active':''}" style="flex:1;font-size:12px;">🌤️ Tarde</button>
        <button data-cat-turno="noche" class="chip cat-turno ${turnos.includes('noche')?'active':''}" style="flex:1;font-size:12px;">🌙 Noche</button>
      </div>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">DÍAS</label>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 20px;">
        ${["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].map((l,i)=>`<button data-cat-day="${i}" class="chip cat-day ${dias.includes(i)?'active':''}" style="font-size:11px;padding:5px 9px;">${l}</button>`).join("")}
      </div>
      <p style="font-size:11px;color:var(--ink-soft);margin-bottom:16px;">Si dejás turno o días sin marcar, esta cátedra va a aparecer siempre, sin filtrar.</p>
      <button id="cat-save" class="btn-primary">Guardar cambios</button>
      <button id="cat-delete" style="width:100%;margin-top:10px;padding:12px;border-radius:8px;color:var(--red);font-weight:600;font-size:13px;border:1px solid var(--red-soft);">Eliminar cátedra</button>
    </div></div>`;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("cat-close").onclick = close;
  const aulaAc = bindAulaAutocomplete("cat-aula", "cat-aula-sug", catedraAula(existing));
  document.getElementById("cat-sheet-bg").onclick = (e) => { if (e.target.id==="cat-sheet-bg") close(); };
  root.querySelectorAll(".cat-turno").forEach(b => b.onclick = () => { const t = b.dataset.catTurno; turnos = turnos.includes(t) ? turnos.filter(x=>x!==t) : [...turnos, t]; b.classList.toggle("active", turnos.includes(t)); });
  root.querySelectorAll(".cat-day").forEach(b => b.onclick = () => {
    const d = parseInt(b.dataset.catDay);
    dias = dias.includes(d) ? dias.filter(x=>x!==d) : [...dias, d].sort();
    b.classList.toggle("active", dias.includes(d));
  });
  document.getElementById("cat-save").onclick = () => {
    const val = document.getElementById("cat-name").value.trim();
    const materia = document.getElementById("cat-materia").value.trim() || null;
    const aula = aulaAc.getId();
    if (!val) return;
    const newLabel = materia ? `${val} - ${materia}` : val;
    const oldLabel = catedraLabel(existing);
    if (newLabel !== oldLabel && (data.catedras||[]).some(c => catedraId(c)!==id && catedraLabel(c) === newLabel)) { document.getElementById("cat-error").classList.remove("hidden"); return; }
    renameCatedra(id, { name: val, materia, aula, turnos, dias });
    close();
  };
  document.getElementById("cat-delete").onclick = () => { if (confirm(`¿Eliminar la cátedra ${catedraLabel(existing)}?`)) { removeCatedra(id); close(); } };
}

/* ---------- detalle de puerta ---------- */
let selectedCatedra = null, markCleanChecked = false;
function renderDoorDetail() {
  const root = document.getElementById("detail-root");
  if (document.getElementById("all-notes-bg")) return;
  if (!selectedDoorId || !data.doors[selectedDoorId]) { if (!noteDraftIds) root.innerHTML = ""; return; }
  const d = data.doors[selectedDoorId];
  const pr = d.pendingRequest;
  const delayed = pr && (now()-pr.requestedAt>DELAY_MS);
  const doorHist = data.history.filter(h=>h.doorId===d.id).sort((a,b)=>b.executedAt-a.executedAt).slice(0,5);
  const doorNotes = (data.notes||[]).filter(n => n.doorIds && n.doorIds.includes(d.id));
  const catedras = catedrasForToday();
  const totalCatedras = (data.catedras||[]).length;

  root.innerHTML = `<div class="sheet" id="sheet-bg"><div class="sheet-inner">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h2 class="display" style="font-size:20px;font-weight:700;margin:0;">${esc(d.label)}</h2>
      <button id="sheet-close" style="font-size:20px;">✕</button>
    </div>
    <p style="margin:0 0 4px;font-weight:600;">Estado actual: ${d.status==="open"?"Abierta 🟢":"Cerrada 🔴"}</p>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;">🔑 ${d.keyHolder?`Llave en poder de ${esc(d.keyHolder)}`:"Llave sin registrar"} · ${esc(d.sectorLabel)}</p>
    ${d.hasTV ? `<div class="card" style="margin-bottom:16px;background:#F1ECDD;"><p style="font-size:12px;margin:0;">📺 Tiene TV — extremar el cuidado al cerrar.</p></div>` : ""}
    ${d.status==="closed" && d.clean ? `<div class="card" style="margin-bottom:16px;background:var(--green-soft);"><p style="font-size:12px;margin:0;">✅ Quedó cerrada y limpia — limpieza no necesita revisarla.</p></div>` : ""}
    ${pr ? `<div class="card" style="margin-bottom:16px;background:${pr.type==="open"?"var(--green-soft)":"var(--red-soft)"};">
        <p style="font-weight:700;font-size:13px;margin:0 0 4px;">${delayed?"⚠️ ":"🔔 "}Piden ${pr.type==="open"?"ABRIR":"CERRAR"} ${delayed?"· demorada":""}</p>
        <p style="font-size:12px;color:var(--ink-soft);margin:0;">Lo pidió ${esc(pr.requestedBy)} · ${elapsed(pr.requestedAt)}${pr.catedra?` · Cátedra ${esc(pr.catedra)}`:""}</p>
      </div>` : ""}
    ${user.role==="jefe" ? `
      <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">PEDIR AL PERSONAL DEL PISO</p>
      <p style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">Cátedra (opcional)</p>
      ${catedras.length ? `<div id="det-catedras" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">${catedras.map(c=>`<button class="chip det-cat" data-cat="${esc(catedraLabel(c))}">${esc(catedraLabel(c))}${catedraAula(c)?` (aula ${esc(aulaLabel(catedraAula(c)))})`:""}</button>`).join("")}</div>` : ""}
      ${totalCatedras > catedras.length ? `<p style="font-size:10px;color:var(--ink-soft);margin:0 0 6px;">Hay ${totalCatedras - catedras.length} cátedra(s) más cargadas para otro turno/día — si es una de esas, escribila de nuevo abajo.</p>` : ""}
      <div style="display:flex;gap:6px;margin-bottom:4px;">
        <input id="new-cat-inline" placeholder="¿No está en la lista? Escribila acá" style="flex:1;border:1px solid #D8CFB8;border-radius:6px;padding:7px 10px;font-size:12px;" />
        <button id="new-cat-inline-btn" style="background:var(--ink);color:#F7F4EC;padding:0 12px;border-radius:6px;font-size:12px;font-weight:600;">+</button>
      </div>
      ${!hasPermission(user,"gestionCatedras") ? `<p style="font-size:10px;color:var(--ink-soft);margin:2px 0 6px;">Esta cátedra queda guardada solo en este pedido, no se suma al catálogo general.</p>` : ""}
      <p id="cat-selected-label" style="font-size:11px;color:var(--brass);font-weight:600;margin:4px 0 8px;"></p>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button id="det-req-open" ${pr?.type==="open"?"disabled":""} style="flex:1;padding:8px;border-radius:6px;background:var(--green-soft);font-size:13px;font-weight:600;opacity:${pr?.type==="open"?0.5:1};">🚪 Pedir apertura</button>
        <button id="det-req-closed" ${pr?.type==="closed"?"disabled":""} style="flex:1;padding:8px;border-radius:6px;background:var(--red-soft);font-size:13px;font-weight:600;opacity:${pr?.type==="closed"?0.5:1};">🚪 Pedir cierre</button>
      </div>` : ""}
    <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">YA LO HICE CON LA LLAVE — MARCAR</p>
    <p style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">Usalo también si te lo pidieron por handy, sin pasar por una solicitud del sistema.</p>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--ink-soft);">
      <input type="checkbox" id="det-clean" /> Quedó cerrada y limpia (limpieza no la necesita revisar)
    </label>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button id="det-mark-open" style="flex:1;padding:13px;border-radius:6px;background:var(--green);color:#fff;font-weight:700;font-size:14px;">✓ Abierta</button>
      <button id="det-mark-closed" style="flex:1;padding:13px;border-radius:6px;background:var(--red);color:#fff;font-weight:700;font-size:14px;">✓ Cerrada</button>
    </div>
    ${doorNotes.length ? `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">NOTAS DE ESTA AULA</p>` +
      doorNotes.map(n=>`<div class="card" style="margin-bottom:6px;background:var(--brass-soft);"><p style="font-size:12px;font-weight:600;margin:0;">${esc(n.text)}</p><p style="font-size:10px;color:var(--ink-soft);margin:2px 0 0;">${n.recurrence==="semanal"?"Todas las semanas":"Una vez"}${n.time?` · ${n.time} hs`:""}</p></div>`).join("") : ""}
    <p class="mono" style="font-size:11px;color:var(--ink-soft);margin:16px 0 6px;">ANOMALÍAS</p>
    ${(d.anomalies||[]).filter(a=>!a.resolved).map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;background:var(--red-soft);border-radius:6px;padding:8px;margin-bottom:6px;">
        <div><p style="font-size:12px;font-weight:700;color:var(--red);margin:0;">${esc(a.text)}</p><p style="font-size:10px;color:var(--ink-soft);margin:0;">${esc(a.reportedBy)} · ${elapsed(a.reportedAt)}</p></div>
        <button data-resolve="${a.id}" style="font-size:10px;font-weight:600;color:var(--green);white-space:nowrap;">✓ Resuelta</button>
      </div>`).join("")}
    <div style="display:flex;gap:6px;margin-bottom:16px;">
      <input id="anomaly-text" placeholder="Ej: se quemaron 3 lamparitas" style="flex:1;border:1px solid #D8CFB8;border-radius:6px;padding:7px 10px;font-size:12px;" />
      <button id="anomaly-btn" style="background:var(--ink);color:#F7F4EC;padding:0 12px;border-radius:6px;font-size:12px;font-weight:600;">Reportar</button>
    </div>
    ${doorHist.length ? `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">ÚLTIMOS MOVIMIENTOS</p>` +
      doorHist.map(h=>`<div style="font-size:12px;border-top:1px solid #E4DECB;padding:6px 0;"><span style="font-weight:600;">${h.action==="open"?"Abierta":"Cerrada"}</span><span class="mono" style="color:var(--ink-soft);"> · ${fmtTime(h.executedAt)}</span><div style="color:var(--ink-soft);">${h.requestedBy?`pidió ${esc(h.requestedBy)}${h.catedra?` (Cátedra ${esc(h.catedra)})`:""} · `:"sin solicitud (handy) · "}ejecutó ${esc(h.executedBy)}</div></div>`).join("") : ""}
  </div></div>`;

  const close = () => { selectedDoorId = null; selectedCatedra = null; markCleanChecked = false; render(); };
  document.getElementById("sheet-close").onclick = close;
  document.getElementById("sheet-bg").onclick = (e) => { if (e.target.id==="sheet-bg") close(); };
  document.getElementById("det-mark-open").onclick = () => { if (confirmIfMismatch([d], "open")) markDoor(d.id, "open"); };
  document.getElementById("det-mark-closed").onclick = () => { if (confirmIfMismatch([d], "closed")) markDoor(d.id, "closed", document.getElementById("det-clean").checked); };
  const ro = document.getElementById("det-req-open"), rc = document.getElementById("det-req-closed");
  if (ro) ro.onclick = () => { if (confirmIfAlreadyInState([d], "open")) requestChange(d.id, "open", selectedCatedra); };
  if (rc) rc.onclick = () => { if (confirmIfAlreadyInState([d], "closed")) requestChange(d.id, "closed", selectedCatedra); };
  root.querySelectorAll(".det-cat").forEach(b => b.onclick = () => {
    selectedCatedra = selectedCatedra===b.dataset.cat ? null : b.dataset.cat;
    root.querySelectorAll(".det-cat").forEach(x=>x.classList.toggle("active", x.dataset.cat===selectedCatedra));
    document.getElementById("cat-selected-label").textContent = selectedCatedra ? `Seleccionada: ${selectedCatedra}` : "";
  });
  const newCatI = document.getElementById("new-cat-inline"), newCatBtn = document.getElementById("new-cat-inline-btn");
  if (newCatBtn) newCatBtn.onclick = () => {
    const v = newCatI.value.trim(); if (!v) return;
    if (hasPermission(user, "gestionCatedras")) {
      if (!(data.catedras||[]).some(c => catedraLabel(c) === v)) addCatedra({ name: v, turnos: (user.turnos||[]), dias: [new Date().getDay()] });
    }
    // sin el permiso, la cátedra escrita acá no se suma al catálogo general — queda guardada únicamente en este pedido puntual.
    selectedCatedra = v; newCatI.value = "";
    document.getElementById("cat-selected-label").textContent = `Seleccionada: ${v}`;
  };
  const anI = document.getElementById("anomaly-text"), anBtn = document.getElementById("anomaly-btn");
  anBtn.onclick = () => { if (anI.value.trim()) { reportAnomaly(d.id, anI.value.trim()); anI.value = ""; } };
  root.querySelectorAll("[data-resolve]").forEach(b => b.onclick = () => resolveAnomaly(d.id, b.dataset.resolve));
}

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
