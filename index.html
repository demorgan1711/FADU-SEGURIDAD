<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Control Seguridad FADU</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#22303C" />
<link rel="icon" href="icons/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE8DD; --ink:#22303C; --ink-soft:#5B6B73; --brass:#B08D3D; --brass-soft:#E4D6AE;
    --green:#3F8F5F; --green-soft:#DCEEE1; --red:#B5432E; --red-soft:#F3DCD5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);}
  .display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;}
  input{font-family:inherit;}
  .header{background:var(--ink);color:#F7F4EC;padding:20px 16px 12px;border-radius:0 0 14px 14px;display:flex;justify-content:space-between;align-items:center;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .plate{position:relative;background:#F7F4EC;border:1px solid #D8CFB8;border-radius:8px;aspect-ratio:1/0.85;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  .dot{width:10px;height:10px;border-radius:999px;margin-bottom:4px;}
  @keyframes pulseG{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(63,143,95,.5)}50%{opacity:.45;box-shadow:0 0 0 7px rgba(63,143,95,0)}}
  @keyframes pulseR{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(181,67,46,.5)}50%{opacity:.45;box-shadow:0 0 0 7px rgba(181,67,46,0)}}
  .pg{animation:pulseG 1.3s ease-in-out infinite;} .pr{animation:pulseR 1.3s ease-in-out infinite;}
  .pgf{animation:pulseG .7s ease-in-out infinite;} .prf{animation:pulseR .7s ease-in-out infinite;}
  .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;}
  .tabs-inner{max-width:480px;width:100%;background:#fff;border-top:1px solid #D8CFB8;display:flex;justify-content:space-around;padding:8px 4px;}
  .tab-btn{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-soft);position:relative;padding:2px 8px;}
  .tab-btn.active{color:var(--ink);font-weight:600;}
  .sheet{position:fixed;inset:0;background:rgba(34,48,60,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet-inner{max-width:480px;width:100%;max-height:88vh;overflow-y:auto;background:var(--paper);border-radius:16px 16px 0 0;padding:20px;}
  .btn-primary{background:var(--ink);color:#F7F4EC;padding:13px;border-radius:8px;font-weight:600;font-size:15px;width:100%;}
  .btn-primary:disabled{background:#C7BFA9;}
  .card{background:#fff;border:1px solid #D8CFB8;border-radius:10px;padding:12px;}
  .chip{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid #D8CFB8;background:#fff;white-space:nowrap;}
  .chip.active{background:var(--ink);color:#F7F4EC;}
  .hidden{display:none !important;}
  .row-btn{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #E4DECB;width:100%;text-align:left;}
</style>
</head>
<body>

<div id="app">
  <div id="view-login" style="padding:50px 24px;"><div id="login-content"></div></div>

  <div id="view-app" class="hidden">
    <div class="header">
      <div>
        <p class="display" style="font-size:18px;font-weight:700;margin:0;">Control Seguridad FADU</p>
        <p id="user-sub" style="font-size:12px;opacity:.75;margin:2px 0 0;"></p>
      </div>
      <button id="btn-logout" style="color:#F7F4EC;font-size:20px;">⎋</button>
    </div>
    <div id="save-error" class="hidden" style="font-size:11px;color:var(--red);text-align:center;padding:6px 12px;">No se pudo guardar el último cambio. Revisá tu conexión.</div>
    <div id="content-root" style="padding:14px 16px;"></div>
  </div>
</div>

<div id="detail-root"></div>

<div class="tabs hidden" id="tabs-nav">
  <div class="tabs-inner">
    <button class="tab-btn active" data-tab="inicio">🏠<span>Inicio</span></button>
    <button class="tab-btn" data-tab="sectores">▦<span>Sectores</span></button>
    <button class="tab-btn" data-tab="solicitudes">🔔<span id="badge-label">Solicitudes</span></button>
    <button class="tab-btn" data-tab="historial">🕘<span>Historial</span></button>
    <button class="tab-btn hidden" id="tab-btn-personal" data-tab="personal">👥<span>Personal</span></button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

/* ======= PEGÁ ACÁ TU CONFIG DE FIREBASE (Configuración del proyecto > Tus apps) ======= */
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  projectId: "TU_PROYECTO",
  storageBucket: "TU_PROYECTO.appspot.com",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID"
};
/* ======================================================================================= */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const STATE_DOC = doc(db, "app", "estado");

const ZONES = [
  { id: "100", label: "Sector 100" }, { id: "EP", label: "Entrepiso" },
  { id: "200", label: "Sector 200" }, { id: "DEP", label: "Depósitos" },
];
const DELAY_MS = 15 * 60 * 1000;
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const DIAS_CORTO = [{v:0,l:"Dom"},{v:1,l:"Lun"},{v:2,l:"Mar"},{v:3,l:"Mié"},{v:4,l:"Jue"},{v:5,l:"Vie"},{v:6,l:"Sáb"}];

function now(){ return Date.now(); }
function fmtTime(ts){ if(!ts) return ""; return new Date(ts).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function elapsed(ts){ const m=Math.floor((now()-ts)/60000); if(m<1) return "recién"; if(m<60) return `hace ${m} min`; const h=Math.floor(m/60); return `hace ${h} h ${m%60} min`; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- construcción del edificio ---------- */
function buildInitialDoors() {
  const doors = {};
  const add = (id, label, sector, sectorLabel, type, routine, hasTV, excludeFromStats) => {
    doors[id] = { id, label, sector, sectorLabel, type, status: "closed", keyHolder: null, pendingRequest: null, routine, hasTV: !!hasTV, clean: false, anomalies: [], excludeFromStats: !!excludeFromStats };
  };
  for (let n = 101; n <= 124; n++) {
    add(String(n), String(n), "100", "Sector 100", "aula", true);
    if (n === 111) add("S", "Aula S (Feldman)", "100", "Sector 100", "aula", false);
  }
  const SPLIT = [112, 124];
  const TV_EP = ["EP101","EP103","EP106","EP109","EP111","EP113","EP115","EP121","EP123"];
  for (let n = 101; n <= 124; n++) {
    if (SPLIT.includes(n)) {
      ["A","B","C","D"].forEach(l => add(`EP${n}${l}`, `EP${n}${l}`, "EP", "Entrepiso", "aula", false, false, true));
    } else {
      const id = `EP${n}`;
      add(id, id, "EP", "Entrepiso", "aula", true, TV_EP.includes(id));
    }
    if (n === 110) add("EP-DISENO", "Depósito de Diseño", "EP", "Entrepiso", "deposito", false);
  }
  const TV_200 = ["205","206","207","208","226","228"];
  for (let n = 201; n <= 228; n++) add(String(n), String(n), "200", "Sector 200", "aula", true, TV_200.includes(String(n)));
  for (let n = 1; n <= 38; n++) { const num = String(n).padStart(2,"0"); add(`D${num}`, `Depósito ${num}`, "DEP", "Depósitos", "deposito", true); }
  return doors;
}
const EMPTY_STATE = () => ({ doors: buildInitialDoors(), staff: {}, history: [], catedras: [], notes: [] });

/* ---------- estado en memoria + persistencia (documento único en Firestore) ---------- */
let data = null;
let loaded = false;
let user = null; // { name, role, zones: [] }
let tab = "inicio";
let activeSector = "100";
let sectorStatusFilter = null; // null | "open" | "closed"
let selectedDoorId = null;
let selectionMode = false;
let selectedIds = [];
let noteDraftIds = null;
let filterInicio = null;
let saving = false;

async function persist() {
  saving = true; render();
  try { await setDoc(STATE_DOC, data); document.getElementById("save-error").classList.add("hidden"); }
  catch (e) { document.getElementById("save-error").classList.remove("hidden"); }
  finally { saving = false; render(); }
}
function update(mutator) { data = mutator(data); persist(); render(); }

onAuthStateChanged(auth, (u) => { if (!u) signInAnonymously(auth).catch(e => alert("Error de conexión: " + e.message)); else boot(); });

async function boot() {
  const snap = await getDoc(STATE_DOC);
  if (!snap.exists()) { data = EMPTY_STATE(); await setDoc(STATE_DOC, data); }
  else {
    const d = snap.data();
    const doors = { ...d.doors };
    Object.keys(doors).forEach(id => { doors[id] = { clean:false, anomalies:[], excludeFromStats:false, ...doors[id] }; });
    data = { doors, staff: d.staff || {}, history: d.history || [], catedras: d.catedras || [], notes: d.notes || [] };
  }
  loaded = true; render();
  onSnapshot(STATE_DOC, (snap) => {
    if (!snap.exists()) return;
    const d = snap.data();
    const doors = { ...d.doors };
    Object.keys(doors).forEach(id => { doors[id] = { clean:false, anomalies:[], excludeFromStats:false, ...doors[id] }; });
    data = { doors, staff: d.staff || {}, history: d.history || [], catedras: d.catedras || [], notes: d.notes || [] };
    render();
  });
}

/* ---------- login ---------- */
function renderLogin() {
  const el = document.getElementById("login-content");
  if (!loaded) { el.innerHTML = `<p style="text-align:center;color:var(--ink-soft);font-size:13px;">Cargando…</p>`; return; }
  const staffArr = Object.entries(data.staff).map(([name, s]) => ({ name, ...s }));
  const jefes = staffArr.filter(s => s.role === "jefe");
  const pisos = staffArr.filter(s => s.role === "recorrido");

  const header = `
    <div style="text-align:center;margin-bottom:28px;">
      <div style="width:52px;height:52px;border-radius:999px;background:var(--brass-soft);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:22px;">🔑</div>
      <h1 class="display" style="font-size:24px;font-weight:700;margin:0;">Control Seguridad FADU</h1>
      <p style="font-size:13px;color:var(--ink-soft);">Control de aulas y depósitos</p>
    </div>`;

  if (staffArr.length === 0) {
    el.innerHTML = header + `
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">Primer uso: creá tu usuario.</p>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">NOMBRE Y APELLIDO</label>
      <input id="boot-name" placeholder="Ej: Marcelo Gómez" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:12px 14px;font-size:15px;margin:6px 0 16px;" />
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">ROL</label>
      <div style="display:flex;gap:8px;margin:8px 0 20px;">
        <button id="boot-role-recorrido" class="chip" style="flex:1;">🚶 Pisos</button>
        <button id="boot-role-jefe" class="chip active" style="flex:1;">👔 Oficina Seguridad</button>
      </div>
      <button id="boot-submit" class="btn-primary" disabled>Crear usuario y entrar</button>`;
    let bootRole = "jefe";
    const nameI = document.getElementById("boot-name"), btn = document.getElementById("boot-submit");
    const rRec = document.getElementById("boot-role-recorrido"), rJefe = document.getElementById("boot-role-jefe");
    rRec.onclick = () => { bootRole = "recorrido"; rRec.classList.add("active"); rJefe.classList.remove("active"); };
    rJefe.onclick = () => { bootRole = "jefe"; rJefe.classList.add("active"); rRec.classList.remove("active"); };
    nameI.oninput = () => btn.disabled = !nameI.value.trim();
    btn.onclick = async () => {
      const name = nameI.value.trim();
      update(prev => ({ ...prev, staff: { ...prev.staff, [name]: { role: bootRole, zones: [] } } }));
      loginAs(name, { role: bootRole, zones: [] });
    };
    return;
  }

  const rowsHtml = (list, icon) => list.map(s => `<button class="row-btn login-pick" data-id="${esc(s.name)}">
      <span style="font-size:14px;">${icon} ${esc(s.name)}</span>
      <span style="font-size:11px;color:var(--ink-soft);">${(s.zones||[]).map(z=>ZONES.find(zz=>zz.id===z)?.label).join(", ")}</span>
    </button>`).join("");

  el.innerHTML = header + `
    <label class="mono" style="font-size:11px;color:var(--ink-soft);">¿QUIÉN SOS?</label>
    <div style="max-height:300px;overflow-y:auto;margin:8px 0 8px;">
      ${jefes.length ? `<p style="font-size:11px;color:var(--ink-soft);margin:6px 0 2px;">Oficina Seguridad</p>${rowsHtml(jefes,"👔")}` : ""}
      ${pisos.length ? `<p style="font-size:11px;color:var(--ink-soft);margin:10px 0 2px;">Pisos</p>${rowsHtml(pisos,"🚶")}` : ""}
    </div>
    <div id="new-user-toggle">
      <button id="show-new-user" style="width:100%;padding:8px;border-radius:8px;border:1px dashed #D8CFB8;color:var(--ink-soft);font-size:12px;font-weight:600;margin-bottom:12px;">+ No estoy en la lista, crear usuario</button>
    </div>
    <div id="new-user-form" class="hidden card" style="margin-bottom:12px;">
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">NOMBRE Y APELLIDO</label>
      <input id="new-user-name" placeholder="Ej: Marcelo Gómez" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:10px 12px;font-size:14px;margin:6px 0 12px;" />
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">ROL</label>
      <div style="display:flex;gap:8px;margin:8px 0 12px;">
        <button id="new-role-recorrido" class="chip" style="flex:1;">🚶 Pisos</button>
        <button id="new-role-jefe" class="chip active" style="flex:1;">👔 Oficina Seguridad</button>
      </div>
      <button id="new-user-submit" class="btn-primary" disabled>Crear y entrar</button>
    </div>
    <p style="font-size:11px;color:var(--ink-soft);text-align:center;">Sin contraseña — el acceso es solo por nombre, por ahora.</p>`;

  el.querySelectorAll(".login-pick").forEach(b => b.onclick = () => { const s = data.staff[b.dataset.id]; loginAs(b.dataset.id, s); });
  document.getElementById("show-new-user").onclick = () => { document.getElementById("new-user-toggle").classList.add("hidden"); document.getElementById("new-user-form").classList.remove("hidden"); };
  let newRole = "jefe";
  const nr = document.getElementById("new-role-recorrido"), nj = document.getElementById("new-role-jefe");
  nr.onclick = () => { newRole = "recorrido"; nr.classList.add("active"); nj.classList.remove("active"); };
  nj.onclick = () => { newRole = "jefe"; nj.classList.add("active"); nr.classList.remove("active"); };
  const nnI = document.getElementById("new-user-name"), nBtn = document.getElementById("new-user-submit");
  nnI.oninput = () => nBtn.disabled = !nnI.value.trim();
  nBtn.onclick = () => {
    const name = nnI.value.trim();
    update(prev => ({ ...prev, staff: { ...prev.staff, [name]: { role: newRole, zones: [] } } }));
    loginAs(name, { role: newRole, zones: [] });
  };
}

function loginAs(name, s) {
  user = { name, role: s.role, zones: s.zones || [] };
  document.getElementById("view-login").classList.add("hidden");
  document.getElementById("view-app").classList.remove("hidden");
  document.getElementById("tabs-nav").classList.remove("hidden");
  document.getElementById("tab-btn-personal").classList.toggle("hidden", user.role !== "jefe");
  document.getElementById("user-sub").textContent = `${user.name} · ${user.role==="jefe"?"Oficina Seguridad":"Pisos"}`;
  render();
}
document.getElementById("btn-logout").onclick = () => location.reload();
document.querySelectorAll(".tab-btn").forEach(btn => btn.onclick = () => {
  tab = btn.dataset.tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
});

/* ---------- acciones ---------- */
function requestChange(doorId, type, catedra) {
  update(prev => ({ ...prev, doors: { ...prev.doors, [doorId]: { ...prev.doors[doorId], pendingRequest: { type, requestedBy: user.name, requestedAt: now(), catedra: catedra || null } } } }));
  selectedDoorId = null; render();
}
function markDoor(doorId, status, clean) {
  update(prev => {
    const d = prev.doors[doorId]; const pr = d.pendingRequest;
    const entry = { id:`${doorId}-${now()}`, doorId, doorLabel:d.label, action:status, requestedBy: pr?pr.requestedBy:null, requestedAt: pr?pr.requestedAt:null, catedra: pr?pr.catedra:null, executedBy:user.name, executedAt: now() };
    return { ...prev,
      doors: { ...prev.doors, [doorId]: { ...d, status, keyHolder: status==="open"?user.name:null, pendingRequest:null, clean: status==="closed" ? !!clean : false } },
      history: [entry, ...prev.history].slice(0,300) };
  });
  selectedDoorId = null; render();
}
function reportAnomaly(doorId, text) {
  update(prev => {
    const d = prev.doors[doorId];
    const anomaly = { id:`${doorId}-an-${now()}`, text, reportedBy:user.name, reportedAt:now(), resolved:false };
    return { ...prev, doors: { ...prev.doors, [doorId]: { ...d, anomalies: [anomaly, ...(d.anomalies||[])] } } };
  });
}
function resolveAnomaly(doorId, anomalyId) {
  update(prev => { const d = prev.doors[doorId]; return { ...prev, doors: { ...prev.doors, [doorId]: { ...d, anomalies: (d.anomalies||[]).map(a=>a.id===anomalyId?{...a,resolved:true}:a) } } }; });
}
function saveStaff(name, fields) { update(prev => ({ ...prev, staff: { ...prev.staff, [name]: { ...(prev.staff[name]||{}), ...fields } } })); }
function deleteStaff(name) { update(prev => { const s = {...prev.staff}; delete s[name]; return {...prev, staff:s}; }); }
function addCatedra(name) { update(prev => (prev.catedras||[]).includes(name) ? prev : { ...prev, catedras: [...(prev.catedras||[]), name] }); }
function removeCatedra(name) { update(prev => ({ ...prev, catedras: (prev.catedras||[]).filter(c=>c!==name) })); }
function renameCatedra(oldName, newName) {
  update(prev => {
    const catedras = (prev.catedras||[]).map(c => c===oldName?newName:c);
    const doors = { ...prev.doors };
    Object.keys(doors).forEach(id => { if (doors[id].pendingRequest && doors[id].pendingRequest.catedra===oldName) doors[id] = { ...doors[id], pendingRequest: { ...doors[id].pendingRequest, catedra:newName } }; });
    const history = prev.history.map(h => h.catedra===oldName ? {...h, catedra:newName} : h);
    return { ...prev, catedras, doors, history };
  });
}
function addNote(note) { update(prev => ({ ...prev, notes: [{ id:`note-${now()}`, createdBy:user.name, createdAt:now(), doorIds: note.doorIds||[], ...note }, ...(prev.notes||[])] })); }
function deleteNote(id) { update(prev => ({ ...prev, notes: (prev.notes||[]).filter(n=>n.id!==id) })); }

function startSelection(id) { selectionMode = true; selectedIds = [id]; render(); }
function toggleSelect(id) { selectedIds = selectedIds.includes(id) ? selectedIds.filter(x=>x!==id) : [...selectedIds, id]; render(); }
function clearSelection() { selectionMode = false; selectedIds = []; render(); }
function bulkRequest(type) {
  update(prev => { const doors = {...prev.doors}; selectedIds.forEach(id => { doors[id] = {...doors[id], pendingRequest:{type, requestedBy:user.name, requestedAt:now()}}; }); return {...prev, doors}; });
  clearSelection();
}
function bulkMark(status) {
  update(prev => {
    const doors = {...prev.doors}; const entries = [];
    selectedIds.forEach(id => {
      const d = doors[id]; const pr = d.pendingRequest;
      entries.push({ id:`${id}-${now()}-${Math.random().toString(36).slice(2,6)}`, doorId:id, doorLabel:d.label, action:status, requestedBy:pr?pr.requestedBy:null, requestedAt:pr?pr.requestedAt:null, executedBy:user.name, executedAt:now() });
      doors[id] = { ...d, status, keyHolder: status==="open"?user.name:null, pendingRequest:null, clean:false };
    });
    return { ...prev, doors, history: [...entries, ...prev.history].slice(0,300) };
  });
  clearSelection();
}

/* ---------- placas de puerta ---------- */
let pressTimer = null, firedLongPress = false;
function plateHTML(d) {
  const pr = d.pendingRequest;
  const delayed = pr && (now()-pr.requestedAt>DELAY_MS);
  let dotColor = d.status==="open" ? "var(--green)" : "var(--red)";
  let dotClass = "", tag = "";
  if (pr) {
    dotColor = pr.type==="open" ? "var(--green)" : "var(--red)";
    dotClass = pr.type==="open" ? (delayed?"pgf":"pg") : (delayed?"prf":"pr");
    tag = `<span class="mono" style="font-size:8px;margin-top:2px;color:${dotColor}">${delayed?"¡demorada!":pr.type==="open"?"piden abrir":"piden cerrar"}</span>`;
  } else if (d.routine === false) {
    tag = `<span class="mono" style="font-size:7px;margin-top:2px;color:var(--ink-soft)">no rutina</span>`;
  }
  const selected = selectedIds.includes(d.id);
  return `<button class="plate" data-door="${d.id}"
      style="${selected?'background:var(--brass-soft);border-color:var(--brass);border-width:2px;':''}">
    ${d.hasTV ? '<span style="position:absolute;top:3px;left:3px;font-size:10px;">📺</span>' : ''}
    ${(d.anomalies||[]).some(a=>!a.resolved) ? '<span style="position:absolute;bottom:3px;right:3px;font-size:10px;">⚠️</span>' : ''}
    ${d.status==="closed" && d.clean ? '<span style="position:absolute;bottom:3px;left:3px;font-size:10px;">✅</span>' : ''}
    ${selectionMode ? `<span style="position:absolute;top:3px;right:3px;width:14px;height:14px;border-radius:4px;border:1px solid var(--brass);background:${selected?'var(--brass)':'#fff'};color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;">${selected?'✓':''}</span>` : ''}
    <span class="dot ${dotClass}" style="background:${dotColor}"></span>
    <span class="mono" style="font-size:11px;font-weight:600;text-align:center;line-height:1.1;">${esc(d.label)}</span>${tag}
  </button>`;
}
function bindPlates(root) {
  root.querySelectorAll("[data-door]").forEach(b => {
    const id = b.dataset.door;
    const start = () => { firedLongPress = false; pressTimer = setTimeout(() => { firedLongPress = true; startSelection(id); if (navigator.vibrate) navigator.vibrate(25); }, 450); };
    const cancel = () => { if (pressTimer) clearTimeout(pressTimer); };
    b.addEventListener("touchstart", start); b.addEventListener("touchend", cancel); b.addEventListener("touchmove", cancel);
    b.addEventListener("mousedown", start); b.addEventListener("mouseup", cancel); b.addEventListener("mouseleave", cancel);
    b.addEventListener("contextmenu", e => e.preventDefault());
    b.onclick = () => { if (firedLongPress) { firedLongPress = false; return; } if (selectionMode) toggleSelect(id); else { selectedDoorId = id; render(); } };
  });
}

/* ---------- render principal ---------- */
function render() {
  if (!loaded) return;
  if (!user) { renderLogin(); return; }

  const allDoors = Object.values(data.doors);
  const pendingList = allDoors.filter(d=>d.pendingRequest).sort((a,b)=>a.pendingRequest.requestedAt-b.pendingRequest.requestedAt);
  document.getElementById("badge-label").textContent = pendingList.length ? `Solicitudes (${pendingList.length})` : "Solicitudes";
  document.getElementById("tabs-nav").classList.toggle("hidden", selectionMode);
  document.getElementById("user-sub").textContent = `${user.name} · ${user.role==="jefe"?"Oficina Seguridad":"Pisos"} ${saving?"· guardando…":""}`;

  const root = document.getElementById("content-root");
  if (tab==="inicio") root.innerHTML = renderInicio(allDoors, pendingList);
  if (tab==="sectores") root.innerHTML = renderSectores(allDoors);
  if (tab==="solicitudes") root.innerHTML = renderSolicitudes(pendingList);
  if (tab==="historial") root.innerHTML = renderHistorial();
  if (tab==="personal" && user.role==="jefe") root.innerHTML = renderPersonal();
  bindTabHandlers(root);
  bindPlates(root);

  renderSelectionBar(pendingList);
  renderDoorDetail();
}

/* ---------- Inicio ---------- */
function renderInicio(allDoors, pendingList) {
  const myZones = user.zones || [];
  const doorsForStats = allDoors.filter(d => !d.excludeFromStats);
  const openCount = doorsForStats.filter(d=>d.status==="open").length;
  const closedCount = doorsForStats.filter(d=>d.status==="closed").length;
  const delayedCount = pendingList.filter(d=>now()-d.pendingRequest.requestedAt>DELAY_MS).length;
  const doorsWithAnomalies = allDoors.filter(d => (d.anomalies||[]).some(a=>!a.resolved));
  const myPending = pendingList.filter(d => myZones.includes(d.sector));
  const today = new Date().getDay();
  const notes = [...(data.notes||[])].sort((a,b)=>b.createdAt-a.createdAt);

  let html = "";
  if (user.role==="recorrido" && myPending.length) {
    html += myPending.map(d => `<button data-door="${d.id}" class="card" style="display:flex;gap:10px;align-items:center;width:100%;margin-bottom:8px;background:${d.pendingRequest.type==="open"?"var(--green-soft)":"var(--red-soft)"};border-color:${d.pendingRequest.type==="open"?"var(--green)":"var(--red)"};text-align:left;">
        <span class="dot ${d.pendingRequest.type==="open"?"pg":"pr"}" style="background:${d.pendingRequest.type==="open"?"var(--green)":"var(--red)"};width:12px;height:12px;"></span>
        <div><p style="font-size:14px;font-weight:700;margin:0;">${esc(d.pendingRequest.requestedBy)} pide ${d.pendingRequest.type==="open"?"ABRIR":"CERRAR"} ${esc(d.label)}${d.pendingRequest.catedra?` · Cátedra ${esc(d.pendingRequest.catedra)}`:""}</p>
        <p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">${elapsed(d.pendingRequest.requestedAt)}</p></div></button>`).join("");
  }

  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <p class="display" style="font-size:18px;font-weight:700;margin:0;">Notas</p>
      <button id="toggle-note-form" style="font-size:12px;font-weight:600;color:var(--brass);">+ Agregar</button>
    </div>
    <div id="note-form-root"></div>`;
  if (!notes.length) html += `<p style="font-size:12px;color:var(--ink-soft);margin-bottom:16px;">No hay notas cargadas.</p>`;
  else {
    html += `<div style="margin-bottom:20px;">` + notes.map(n => `
      <div class="card" style="margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;gap:8px;">
          <p style="font-size:13px;font-weight:600;margin:0;">${esc(n.text)}</p>
          <button data-del-note="${n.id}" style="color:var(--ink-soft);font-size:14px;line-height:1;">×</button>
        </div>
        ${n.doorIds && n.doorIds.length ? `<p style="font-size:11px;color:var(--brass);font-weight:600;margin:2px 0 0;">Aulas: ${n.doorIds.map(id=>data.doors[id]?.label||id).join(", ")}</p>` : ""}
        <p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">${n.recurrence==="semanal"?`Todos los ${(n.daysOfWeek||[]).map(v=>DIAS[v]).join(", ")}`:"Una vez"}${n.time?` · ${n.time} hs`:""}${n.recurrence==="semanal"&&(n.daysOfWeek||[]).includes(today)?" · hoy":""} · cargó ${esc(n.createdBy)}</p>
      </div>`).join("") + `</div>`;
  }

  html += `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Resumen</p>
    <div class="grid2" style="margin-bottom:12px;">
      <button data-filter="abiertas" class="card" style="text-align:left;${filterInicio==='abiertas'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;color:var(--green);margin:0;">${openCount}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Puertas abiertas</p></button>
      <button data-filter="cerradas" class="card" style="text-align:left;${filterInicio==='cerradas'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;color:var(--red);margin:0;">${closedCount}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Puertas cerradas</p></button>
      <button data-filter="solicitudes" class="card" style="text-align:left;${filterInicio==='solicitudes'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;margin:0;">${pendingList.length}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Solicitudes</p></button>
      <button data-filter="demoradas" class="card" style="text-align:left;${filterInicio==='demoradas'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;color:var(--red);margin:0;">${delayedCount}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Demoradas</p></button>
      <button data-filter="anomalias" class="card" style="text-align:left;${filterInicio==='anomalias'?'background:var(--brass-soft);border-color:var(--brass);':''}"><p style="font-size:22px;font-weight:700;color:var(--red);margin:0;">${doorsWithAnomalies.length}</p><p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">Anomalías</p></button>
    </div>`;

  if (filterInicio) {
    const labels = { abiertas:"Puertas abiertas", cerradas:"Puertas cerradas", solicitudes:"Solicitudes pendientes", demoradas:"Solicitudes demoradas", anomalias:"Con anomalías" };
    let list = [];
    if (filterInicio==="abiertas") list = doorsForStats.filter(d=>d.status==="open");
    else if (filterInicio==="cerradas") list = doorsForStats.filter(d=>d.status==="closed");
    else if (filterInicio==="solicitudes") list = pendingList;
    else if (filterInicio==="demoradas") list = pendingList.filter(d=>now()-d.pendingRequest.requestedAt>DELAY_MS);
    else if (filterInicio==="anomalias") list = doorsWithAnomalies;
    html += `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">${labels[filterInicio].toUpperCase()} (${list.length})</p>`;
    if (!list.length) html += `<p style="font-size:13px;color:var(--ink-soft);">No hay ninguna en esta categoría.</p>`;
    html += list.map(d => `<button data-door="${d.id}" class="row-btn">
        <span style="font-size:13px;">${esc(d.label)} <span style="color:var(--ink-soft);">· ${esc(d.sectorLabel)}</span></span>
        <span style="font-size:11px;color:var(--ink-soft);">${filterInicio==="anomalias" ? d.anomalies.filter(a=>!a.resolved).map(a=>esc(a.text)).join(", ") : d.pendingRequest ? `${d.pendingRequest.type==="open"?"piden abrir":"piden cerrar"}${d.pendingRequest.catedra?` · Cát. ${esc(d.pendingRequest.catedra)}`:""} · ${elapsed(d.pendingRequest.requestedAt)}` : (d.status==="open"?"abierta":"cerrada")}</span>
      </button>`).join("");
  }

  if (user.role==="recorrido") {
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 2px;">
        <p class="display" style="font-size:18px;font-weight:700;margin:0;">${myZones.length?"Mis sectores":"Sin sector asignado"}</p>
        <button data-goto="sectores" style="font-size:12px;font-weight:600;color:var(--brass);">Ver todos ▦</button>
      </div>`;
    if (myZones.length) {
      html += `<p style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">Mantené presionada un aula para seleccionar varias juntas.</p>`;
      myZones.forEach(zoneId => {
        const zoneLabel = ZONES.find(z=>z.id===zoneId)?.label;
        const doorsInZone = allDoors.filter(d=>d.sector===zoneId);
        html += `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">${zoneLabel?.toUpperCase()}</p><div class="grid4" style="margin-bottom:20px;">${doorsInZone.map(plateHTML).join("")}</div>`;
      });
    } else html += `<p style="font-size:13px;color:var(--ink-soft);margin-bottom:20px;">Todavía no tenés un piso asignado por la oficina de seguridad.</p>`;
  } else if (pendingList.length) {
    html += `<p class="display" style="font-size:18px;font-weight:700;margin-bottom:10px;">Solicitudes en curso</p>` +
      pendingList.slice(0,5).map(d=>`<button data-door="${d.id}" class="row-btn"><span style="font-size:13px;">${esc(d.label)} · ${d.pendingRequest.type==="open"?"abrir":"cerrar"}${d.pendingRequest.catedra?` · Cát. ${esc(d.pendingRequest.catedra)}`:""}</span><span style="font-size:11px;color:var(--ink-soft);">${elapsed(d.pendingRequest.requestedAt)}</span></button>`).join("");
  }
  return html;
}

/* ---------- Sectores ---------- */

      <button id="filter-closed-toggle" class="chip" style="${sectorStatusFilter==="closed"?"border-color:var(--red);background:var(--red-soft);":""}">🚪 Solo cerradas ${sectorStatusFilter==="closed"?`(${shown.length})`:""}</button>

    pendingList.map(d => {

      return `<button data-door="${d.id}" class="card" style="display:flex;justify-content:space-between;width:100%;margin-bottom:8px;background:${d.pendingRequest.type==="open"?"var(--green-soft)":"var(--red-soft)"};text-align:left;">
        <div><p style="font-size:14px;font-weight:700;margin:0;">${esc(d.label)} · ${d.pendingRequest.type==="open"?"ABRIR":"CERRAR"}</p>
        <p style="font-size:11px;color:var(--ink-soft);margin:2px 0 0;">pidió ${esc(d.pendingRequest.requestedBy)}${d.pendingRequest.catedra?` (Cátedra ${esc(d.pendingRequest.catedra)})`:""} · ${esc(d.sectorLabel)}</p></div>
        <span style="font-size:11px;color:${delayed?"var(--red)":"var(--ink-soft)"};font-weight:${delayed?700:400};align-self:center;">${delayed?"¡demorada! ":""}${elapsed(d.pendingRequest.requestedAt)}</span></button>`;

/* ---------- handlers por pestaña ---------- */
function bindTabHandlers(root) {
  if (tab==="inicio") {
    root.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filterInicio = filterInicio===b.dataset.filter?null:b.dataset.filter; render(); });
    root.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { tab = b.dataset.goto; document.querySelectorAll(".tab-btn").forEach(x=>x.classList.toggle("active", x.dataset.tab===tab)); render(); });
    root.querySelectorAll("[data-del-note]").forEach(b => b.onclick = () => deleteNote(b.dataset.delNote));
    const toggleBtn = document.getElementById("toggle-note-form");
    if (toggleBtn) toggleBtn.onclick = () => {
      const r = document.getElementById("note-form-root");
      if (r.innerHTML) { r.innerHTML = ""; return; }
      r.innerHTML = noteFormHTML();
      bindNoteForm(r, (note) => { addNote(note); r.innerHTML = ""; });
    };
  }
  if (tab==="sectores") {
    root.querySelectorAll(".sector-pick").forEach(b => b.onclick = () => { activeSector = b.dataset.zone; render(); });
    const openBtn = document.getElementById("filter-open-toggle");
    if (openBtn) openBtn.onclick = () => { sectorStatusFilter = sectorStatusFilter==="open" ? null : "open"; render(); };
    const closedBtn = document.getElementById("filter-closed-toggle");
    if (closedBtn) closedBtn.onclick = () => { sectorStatusFilter = sectorStatusFilter==="closed" ? null : "closed"; render(); };
  }
  if (tab==="personal" && user.role==="jefe") {
    const addBtn = document.getElementById("add-staff-btn");
    if (addBtn) addBtn.onclick = () => openStaffSheet(null);
    root.querySelectorAll("[data-edit-staff]").forEach(b => b.onclick = () => openStaffSheet(b.dataset.editStaff));
    root.querySelectorAll("[data-edit-catedra]").forEach(b => b.onclick = () => openCatedraSheet(b.dataset.editCatedra));
    const ci = document.getElementById("new-catedra-input"), cb = document.getElementById("new-catedra-btn");
    if (cb) cb.onclick = () => { if (ci.value.trim()) { addCatedra(ci.value.trim()); ci.value=""; } };
  }
}

function noteFormHTML(doorLabels) {
  return `<div class="card" style="margin-bottom:14px;">
    ${doorLabels ? `<p style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">PARA ESTAS AULAS</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;">${doorLabels.map(l=>`<span class="chip active">${esc(l)}</span>`).join("")}</div>` : ""}
    <input id="note-text" placeholder="Ej: abrir la puerta entre 106 y 107" style="width:100%;border:1px solid #D8CFB8;border-radius:6px;padding:9px 10px;font-size:13px;margin-bottom:8px;" />
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <button id="note-rec-unica" class="chip active" style="flex:1;">Una vez</button>
      <button id="note-rec-semanal" class="chip" style="flex:1;">Todas las semanas</button>
    </div>
    <div id="note-days" class="hidden" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">
      ${DIAS_CORTO.map(d=>`<button class="chip note-day" data-day="${d.v}" style="${d.v===5?'background:var(--brass-soft);':''}">${d.v===5?'✓ ':''}${d.l}</button>`).join("")}
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <label style="font-size:11px;color:var(--ink-soft);">Hora (opcional):</label>
      <input id="note-time" type="time" style="border:1px solid #D8CFB8;border-radius:6px;padding:4px 8px;font-size:12px;" />
    </div>
    <button id="note-save" class="btn-primary" disabled>Guardar nota</button>
  </div>`;
}
function bindNoteForm(root, onSave) {
  let recurrence = "unica", daysOfWeek = [5];
  const textI = root.querySelector("#note-text"), saveBtn = root.querySelector("#note-save");
  const recU = root.querySelector("#note-rec-unica"), recS = root.querySelector("#note-rec-semanal"), daysWrap = root.querySelector("#note-days");
  const checkValid = () => saveBtn.disabled = !textI.value.trim() || (recurrence==="semanal" && daysOfWeek.length===0);
  textI.oninput = checkValid;
  recU.onclick = () => { recurrence="unica"; recU.classList.add("active"); recS.classList.remove("active"); daysWrap.classList.add("hidden"); checkValid(); };
  recS.onclick = () => { recurrence="semanal"; recS.classList.add("active"); recU.classList.remove("active"); daysWrap.classList.remove("hidden"); checkValid(); };
  root.querySelectorAll(".note-day").forEach(b => b.onclick = () => {
    const v = parseInt(b.dataset.day);
    if (daysOfWeek.includes(v)) { daysOfWeek = daysOfWeek.filter(x=>x!==v); b.style.background=""; b.textContent = DIAS_CORTO.find(d=>d.v===v).l; }
    else { daysOfWeek = [...daysOfWeek, v].sort(); b.style.background="var(--brass-soft)"; b.textContent = "✓ " + DIAS_CORTO.find(d=>d.v===v).l; }
    checkValid();
  });
  saveBtn.onclick = () => onSave({ text: textI.value.trim(), recurrence, daysOfWeek: recurrence==="semanal"?daysOfWeek:[], time: root.querySelector("#note-time").value || null });
}

/* ---------- barra de seleccion multiple ---------- */
function renderSelectionBar(pendingList) {
  const bar = document.getElementById("selection-bar-root");
  if (bar) bar.remove();
  if (!selectionMode) return;
  const div = document.createElement("div");
  div.id = "selection-bar-root";
  div.className = "fixed";
  div.style.cssText = "position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;";
  div.innerHTML = `<div style="max-width:480px;width:100%;background:#fff;border-top:1px solid #D8CFB8;padding:10px 14px 14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:13px;font-weight:700;">${selectedIds.length} seleccionada${selectedIds.length===1?"":"s"}</span>
        <button id="sel-cancel" style="font-size:12px;color:var(--ink-soft);">✕ Cancelar</button>
      </div>
      ${user.role==="jefe" ? `<div style="display:flex;gap:8px;margin-bottom:8px;">
        <button id="sel-req-open" style="flex:1;padding:8px;border-radius:6px;background:var(--green-soft);font-size:12px;font-weight:600;">Pedir apertura</button>
        <button id="sel-req-closed" style="flex:1;padding:8px;border-radius:6px;background:var(--red-soft);font-size:12px;font-weight:600;">Pedir cierre</button>
      </div>` : ""}
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <button id="sel-mark-open" style="flex:1;padding:8px;border-radius:6px;background:var(--green);color:#fff;font-size:12px;font-weight:700;">Marcar abiertas</button>
        <button id="sel-mark-closed" style="flex:1;padding:8px;border-radius:6px;background:var(--red);color:#fff;font-size:12px;font-weight:700;">Marcar cerradas</button>
      </div>
      <button id="sel-add-note" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--brass);font-size:12px;font-weight:600;">📝 Agregar nota para estas aulas</button>
    </div>`;
  document.body.appendChild(div);
  document.getElementById("sel-cancel").onclick = clearSelection;
  document.getElementById("sel-mark-open").onclick = () => bulkMark("open");
  document.getElementById("sel-mark-closed").onclick = () => bulkMark("closed");
  const ro = document.getElementById("sel-req-open"), rc = document.getElementById("sel-req-closed");
  if (ro) ro.onclick = () => bulkRequest("open");
  if (rc) rc.onclick = () => bulkRequest("closed");
  document.getElementById("sel-add-note").onclick = () => { noteDraftIds = [...selectedIds]; clearSelection(); renderNoteSheet(); };
}

function renderNoteSheet() {
  if (!noteDraftIds) return;
  const root = document.getElementById("detail-root");
  const labels = noteDraftIds.map(id => data.doors[id]?.label).filter(Boolean);
  root.innerHTML = `<div class="sheet" id="note-sheet-bg"><div class="sheet-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 class="display" style="font-size:20px;font-weight:700;margin:0;">Nueva nota</h2>
        <button id="note-sheet-close" style="font-size:20px;">✕</button>
      </div>
      ${noteFormHTML(labels)}
    </div></div>`;
  document.getElementById("note-sheet-close").onclick = () => { noteDraftIds = null; root.innerHTML = ""; };
  document.getElementById("note-sheet-bg").onclick = (e) => { if (e.target.id==="note-sheet-bg") { noteDraftIds=null; root.innerHTML=""; } };
  bindNoteForm(root, (note) => { addNote({ ...note, doorIds: noteDraftIds }); noteDraftIds = null; root.innerHTML = ""; });
}

/* ---------- ficha de personal ---------- */
function openStaffSheet(name) {
  const existing = name ? data.staff[name] : null;
  const root = document.getElementById("detail-root");
  let role = existing ? existing.role : "recorrido";
  let zones = existing ? [...(existing.zones||[])] : [];
  root.innerHTML = `<div class="sheet" id="staff-sheet-bg"><div class="sheet-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 class="display" style="font-size:20px;font-weight:700;margin:0;">${name?esc(name):"Nueva persona"}</h2>
        <button id="staff-close" style="font-size:20px;">✕</button>
      </div>
      ${!name ? `<label class="mono" style="font-size:11px;color:var(--ink-soft);">NOMBRE Y APELLIDO</label>
        <input id="staff-name" placeholder="Ej: Marcelo Gómez" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:11px 12px;font-size:14px;margin:6px 0 16px;" />` : ""}
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">ROL</label>
      <div style="display:flex;gap:8px;margin:8px 0 16px;">
        <button id="staff-role-recorrido" class="chip ${role==='recorrido'?'active':''}" style="flex:1;">🚶 Pisos</button>
        <button id="staff-role-jefe" class="chip ${role==='jefe'?'active':''}" style="flex:1;">👔 Oficina Seguridad</button>
      </div>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">PISOS ASIGNADOS (podés elegir más de uno)</label>
      <div id="staff-zones" style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 20px;">
        ${ZONES.map(z=>`<button class="chip staff-zone ${zones.includes(z.id)?'active':''}" data-zone="${z.id}">${zones.includes(z.id)?'✓ ':''}${z.label}</button>`).join("")}
      </div>
      <button id="staff-save" class="btn-primary" ${name?'':'disabled'}>${name?"Guardar cambios":"Crear persona"}</button>
      ${name?`<button id="staff-delete" style="width:100%;margin-top:10px;padding:12px;border-radius:8px;color:var(--red);font-weight:600;font-size:13px;border:1px solid var(--red-soft);">Eliminar persona</button>`:""}
    </div></div>`;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("staff-close").onclick = close;
  document.getElementById("staff-sheet-bg").onclick = (e) => { if (e.target.id==="staff-sheet-bg") close(); };
  const rRec = document.getElementById("staff-role-recorrido"), rJefe = document.getElementById("staff-role-jefe");
  rRec.onclick = () => { role="recorrido"; rRec.classList.add("active"); rJefe.classList.remove("active"); };
  rJefe.onclick = () => { role="jefe"; rJefe.classList.add("active"); rRec.classList.remove("active"); };
  root.querySelectorAll(".staff-zone").forEach(b => b.onclick = () => {
    const z = b.dataset.zone;
    zones = zones.includes(z) ? zones.filter(x=>x!==z) : [...zones, z];
    root.querySelectorAll(".staff-zone").forEach(x => { const zz = ZONES.find(zo=>zo.id===x.dataset.zone); x.classList.toggle("active", zones.includes(x.dataset.zone)); x.textContent = (zones.includes(x.dataset.zone)?'✓ ':'') + zz.label; });
  });
  const saveBtn = document.getElementById("staff-save");
  const nameI = document.getElementById("staff-name");
  if (nameI) nameI.oninput = () => saveBtn.disabled = !nameI.value.trim();
  saveBtn.onclick = () => {
    const id = name || nameI.value.trim();
    if (!name && data.staff[id]) { alert("Ya existe una persona con ese nombre."); return; }
    saveStaff(id, { role, zones });
    close();
  };
  const delBtn = document.getElementById("staff-delete");
  if (delBtn) delBtn.onclick = () => { if (confirm(`¿Eliminar a ${name}?`)) { deleteStaff(name); close(); } };
}

function openCatedraSheet(name) {
  const root = document.getElementById("detail-root");
  root.innerHTML = `<div class="sheet" id="cat-sheet-bg"><div class="sheet-inner">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 class="display" style="font-size:20px;font-weight:700;margin:0;">Editar cátedra</h2>
        <button id="cat-close" style="font-size:20px;">✕</button>
      </div>
      <label class="mono" style="font-size:11px;color:var(--ink-soft);">NOMBRE</label>
      <input id="cat-name" value="${esc(name)}" style="width:100%;border:1px solid #D8CFB8;border-radius:8px;padding:11px 12px;font-size:14px;margin:6px 0 6px;" />
      <p id="cat-error" class="hidden" style="font-size:11px;color:var(--red);margin-bottom:10px;">Ya existe una cátedra con ese nombre.</p>
      <p style="font-size:11px;color:var(--ink-soft);margin-bottom:16px;">Los pedidos y el historial que ya usaron "${esc(name)}" se actualizan solos al nombre nuevo.</p>
      <button id="cat-save" class="btn-primary">Guardar cambios</button>
      <button id="cat-delete" style="width:100%;margin-top:10px;padding:12px;border-radius:8px;color:var(--red);font-weight:600;font-size:13px;border:1px solid var(--red-soft);">Eliminar cátedra</button>
    </div></div>`;
  const close = () => { root.innerHTML = ""; };
  document.getElementById("cat-close").onclick = close;
  document.getElementById("cat-sheet-bg").onclick = (e) => { if (e.target.id==="cat-sheet-bg") close(); };
  document.getElementById("cat-save").onclick = () => {
    const val = document.getElementById("cat-name").value.trim();
    if (!val) return;
    if (val !== name && (data.catedras||[]).includes(val)) { document.getElementById("cat-error").classList.remove("hidden"); return; }
    if (val !== name) renameCatedra(name, val);
    close();
  };
  document.getElementById("cat-delete").onclick = () => { if (confirm(`¿Eliminar la cátedra ${name}?`)) { removeCatedra(name); close(); } };
}

/* ---------- detalle de puerta ---------- */
let selectedCatedra = null, markCleanChecked = false;
function renderDoorDetail() {
  const root = document.getElementById("detail-root");
  if (!selectedDoorId || !data.doors[selectedDoorId]) { if (!noteDraftIds) root.innerHTML = ""; return; }
  const d = data.doors[selectedDoorId];
  const pr = d.pendingRequest;
  const delayed = pr && (now()-pr.requestedAt>DELAY_MS);
  const doorHist = data.history.filter(h=>h.doorId===d.id).slice(0,5);
  const doorNotes = (data.notes||[]).filter(n => n.doorIds && n.doorIds.includes(d.id));
  const catedras = data.catedras || [];

  root.innerHTML = `<div class="sheet" id="sheet-bg"><div class="sheet-inner">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <h2 class="display" style="font-size:20px;font-weight:700;margin:0;">${esc(d.label)}</h2>
      <button id="sheet-close" style="font-size:20px;">✕</button>
    </div>
    <p style="margin:0 0 4px;font-weight:600;">Estado actual: ${d.status==="open"?"Abierta 🟢":"Cerrada 🔴"}</p>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;">🔑 ${d.keyHolder?`Llave en poder de ${esc(d.keyHolder)}`:"Llave sin registrar"} · ${esc(d.sectorLabel)}</p>
    ${d.routine===false ? `<div class="card" style="margin-bottom:16px;background:#F1ECDD;"><p style="font-size:12px;margin:0;">⚠️ Este ambiente se maneja aparte, la llave no es del recorrido normal.</p></div>` : ""}
    ${d.hasTV ? `<div class="card" style="margin-bottom:16px;background:#F1ECDD;"><p style="font-size:12px;margin:0;">📺 Tiene TV — extremar el cuidado al cerrar.</p></div>` : ""}
    ${d.status==="closed" && d.clean ? `<div class="card" style="margin-bottom:16px;background:var(--green-soft);"><p style="font-size:12px;margin:0;">✅ Quedó cerrada y limpia — limpieza no necesita revisarla.</p></div>` : ""}
    ${pr ? `<div class="card" style="margin-bottom:16px;background:${pr.type==="open"?"var(--green-soft)":"var(--red-soft)"};">
        <p style="font-weight:700;font-size:13px;margin:0 0 4px;">${delayed?"⚠️ ":"🔔 "}Piden ${pr.type==="open"?"ABRIR":"CERRAR"} ${delayed?"· demorada":""}</p>
        <p style="font-size:12px;color:var(--ink-soft);margin:0;">Lo pidió ${esc(pr.requestedBy)} · ${elapsed(pr.requestedAt)}${pr.catedra?` · Cátedra ${esc(pr.catedra)}`:""}</p>
      </div>` : ""}
    ${user.role==="jefe" ? `
      <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">PEDIR AL PERSONAL DEL PISO</p>
      <p style="font-size:11px;color:var(--ink-soft);margin-bottom:4px;">Cátedra (opcional)</p>
      ${catedras.length ? `<div id="det-catedras" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">${catedras.map(c=>`<button class="chip det-cat" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
      <div style="display:flex;gap:6px;margin-bottom:4px;">
        <input id="new-cat-inline" placeholder="¿No está en la lista? Escribila acá" style="flex:1;border:1px solid #D8CFB8;border-radius:6px;padding:7px 10px;font-size:12px;" />
        <button id="new-cat-inline-btn" style="background:var(--ink);color:#F7F4EC;padding:0 12px;border-radius:6px;font-size:12px;font-weight:600;">+</button>
      </div>
      <p id="cat-selected-label" style="font-size:11px;color:var(--brass);font-weight:600;margin:4px 0 8px;"></p>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        <button id="det-req-open" ${pr?.type==="open"?"disabled":""} style="flex:1;padding:8px;border-radius:6px;background:var(--green-soft);font-size:13px;font-weight:600;opacity:${pr?.type==="open"?0.5:1};">🚪 Pedir apertura</button>
        <button id="det-req-closed" ${pr?.type==="closed"?"disabled":""} style="flex:1;padding:8px;border-radius:6px;background:var(--red-soft);font-size:13px;font-weight:600;opacity:${pr?.type==="closed"?0.5:1};">🚪 Pedir cierre</button>
      </div>` : ""}
    <p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">YA LO HICE CON LA LLAVE — MARCAR</p>
    <p style="font-size:11px;color:var(--ink-soft);margin-bottom:8px;">Usalo también si te lo pidieron por handy, sin pasar por una solicitud del sistema.</p>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--ink-soft);">
      <input type="checkbox" id="det-clean" /> Quedó cerrada y limpia (limpieza no la necesita revisar)
    </label>
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button id="det-mark-open" style="flex:1;padding:13px;border-radius:6px;background:var(--green);color:#fff;font-weight:700;font-size:14px;">✓ Abierta</button>
      <button id="det-mark-closed" style="flex:1;padding:13px;border-radius:6px;background:var(--red);color:#fff;font-weight:700;font-size:14px;">✓ Cerrada</button>
    </div>
    ${doorNotes.length ? `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">NOTAS DE ESTA AULA</p>` +
      doorNotes.map(n=>`<div class="card" style="margin-bottom:6px;background:var(--brass-soft);"><p style="font-size:12px;font-weight:600;margin:0;">${esc(n.text)}</p><p style="font-size:10px;color:var(--ink-soft);margin:2px 0 0;">${n.recurrence==="semanal"?"Todas las semanas":"Una vez"}${n.time?` · ${n.time} hs`:""}</p></div>`).join("") : ""}
    <p class="mono" style="font-size:11px;color:var(--ink-soft);margin:16px 0 6px;">ANOMALÍAS</p>
    ${(d.anomalies||[]).filter(a=>!a.resolved).map(a=>`<div style="display:flex;justify-content:space-between;gap:8px;background:var(--red-soft);border-radius:6px;padding:8px;margin-bottom:6px;">
        <div><p style="font-size:12px;font-weight:600;margin:0;">${esc(a.text)}</p><p style="font-size:10px;color:var(--ink-soft);margin:0;">${esc(a.reportedBy)} · ${elapsed(a.reportedAt)}</p></div>
        <button data-resolve="${a.id}" style="font-size:10px;font-weight:600;color:var(--green);white-space:nowrap;">✓ Resuelta</button>
      </div>`).join("")}
    <div style="display:flex;gap:6px;margin-bottom:16px;">
      <input id="anomaly-text" placeholder="Ej: se quemaron 3 lamparitas" style="flex:1;border:1px solid #D8CFB8;border-radius:6px;padding:7px 10px;font-size:12px;" />
      <button id="anomaly-btn" style="background:var(--ink);color:#F7F4EC;padding:0 12px;border-radius:6px;font-size:12px;font-weight:600;">Reportar</button>
    </div>
    ${doorHist.length ? `<p class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">ÚLTIMOS MOVIMIENTOS</p>` +
      doorHist.map(h=>`<div style="font-size:12px;border-top:1px solid #E4DECB;padding:6px 0;"><span style="font-weight:600;">${h.action==="open"?"Abierta":"Cerrada"}</span><span class="mono" style="color:var(--ink-soft);"> · ${fmtTime(h.executedAt)}</span><div style="color:var(--ink-soft);">${h.requestedBy?`pidió ${esc(h.requestedBy)}${h.catedra?` (Cátedra ${esc(h.catedra)})`:""} · `:"sin solicitud (handy) · "}ejecutó ${esc(h.executedBy)}</div></div>`).join("") : ""}
  </div></div>`;

  const close = () => { selectedDoorId = null; selectedCatedra = null; markCleanChecked = false; render(); };
  document.getElementById("sheet-close").onclick = close;
  document.getElementById("sheet-bg").onclick = (e) => { if (e.target.id==="sheet-bg") close(); };
  document.getElementById("det-mark-open").onclick = () => markDoor(d.id, "open");
  document.getElementById("det-mark-closed").onclick = () => markDoor(d.id, "closed", document.getElementById("det-clean").checked);
  const ro = document.getElementById("det-req-open"), rc = document.getElementById("det-req-closed");
  if (ro) ro.onclick = () => requestChange(d.id, "open", selectedCatedra);
  if (rc) rc.onclick = () => requestChange(d.id, "closed", selectedCatedra);
  root.querySelectorAll(".det-cat").forEach(b => b.onclick = () => {
    selectedCatedra = selectedCatedra===b.dataset.cat ? null : b.dataset.cat;
    root.querySelectorAll(".det-cat").forEach(x=>x.classList.toggle("active", x.dataset.cat===selectedCatedra));
    document.getElementById("cat-selected-label").textContent = selectedCatedra ? `Seleccionada: ${selectedCatedra}` : "";
  });
  const newCatI = document.getElementById("new-cat-inline"), newCatBtn = document.getElementById("new-cat-inline-btn");
  if (newCatBtn) newCatBtn.onclick = () => {
    const v = newCatI.value.trim(); if (!v) return;
    if (!catedras.includes(v)) addCatedra(v);
    selectedCatedra = v; newCatI.value = "";
    document.getElementById("cat-selected-label").textContent = `Seleccionada: ${v}`;
  };
  const anI = document.getElementById("anomaly-text"), anBtn = document.getElementById("anomaly-btn");
  anBtn.onclick = () => { if (anI.value.trim()) { reportAnomaly(d.id, anI.value.trim()); anI.value = ""; } };
  root.querySelectorAll("[data-resolve]").forEach(b => b.onclick = () => resolveAnomaly(d.id, b.dataset.resolve));
}

if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
